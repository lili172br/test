<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔮 聖三角潛意識矩陣占卜 // Sub-Node</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { 
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            background-color: #050505;
            color: #d1d1d1; 
            text-align: center; 
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            background-image: radial-gradient(circle at 2px 2px, #161616 1px, transparent 0);
            background-size: 24px 24px;
            -webkit-user-select: none;
            user-select: none;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .main-content { flex-grow: 1; width: 100%; }
        h1 { color: #ffffff; font-weight: 900; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 5px; margin-top: 20px; }
        .sys-status { font-size: 9px; color: #dc2626; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 25px; }
        
        .panel-section { 
            margin: 20px auto; max-width: 650px; background: #0a0a0a; padding: 30px 25px; 
            border-radius: 12px; border: 1px solid #1f1f1f; box-shadow: 0 8px 32px rgba(0,0,0,0.8); box-sizing: border-box;
        }

        .intro-text { text-align: left; font-size: 14px; line-height: 1.8; color: #a1a1aa; margin-bottom: 30px; }
        
        .panel-section label { display: block; margin: 12px 0 6px 0; font-size: 13px; color: #a1a1aa; tracking: 0.05em; }
        .panel-section input, .panel-section select { 
            width: 85%; padding: 12px; font-size: 14px; border: 1px solid #27272a; border-radius: 6px; 
            background: #050505; color: #fff; text-align: center; outline: none; transition: 0.3s; box-sizing: border-box;
            font-family: inherit;
        }
        .panel-section input:focus, .panel-section select:focus { border-color: #dc2626; box-shadow: 0 0 12px rgba(220, 38, 38, 0.2); }
        
        #user-question-display { font-size: 15px; color: #ffffff; margin: 25px 0 10px 0; font-weight: bold; min-height: 27px; }
        #flow-hint { color: #52525b; font-style: italic; font-size: 12px; margin-bottom: 20px; text-transform: uppercase; tracking: 0.1em; }

        .container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 20px; min-height: 340px; width: 100%; box-sizing: border-box; }
        .card-box { width: 160px; text-align: center; box-sizing: border-box; }
        .card-box h3 { color: #71717a; font-size: 11px; margin-bottom: 12px; tracking: 0.1em; text-transform: uppercase; }
        
        .card { 
            width: 160px; height: 274px; perspective: 1000px; margin: 0 auto 15px auto; 
            pointer-events: none; opacity: 0.2; transition: opacity 0.3s, border-color 0.3s, box-shadow 0.3s; box-sizing: border-box;
        }
        
        .card.scanning { opacity: 0.9; }
        
        .card.playable { 
            pointer-events: auto; opacity: 1; cursor: pointer;
            animation: cardPulse 2s infinite ease-in-out;
        }
        .card.playable:hover { transform: translateY(-6px); filter: drop-shadow(0 0 15px rgba(220, 38, 38, 0.4)); }
        .card.flipped { opacity: 1; }
        
        @keyframes cardPulse {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(220, 38, 38, 0.15)); }
            50% { filter: drop-shadow(0 0 12px rgba(220, 38, 38, 0.4)); }
        }
        
        .card-inner { width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.9); box-sizing: border-box; }
        
        .card-back { 
            background: #0d0d0d; border: 1px solid #3f3f46; display: flex; align-items: center; justify-content: center; color: #a1a1aa; font-size: 36px;
        }
        .card.scanning .card-back {
            border-color: #dc2626;
            color: #fff;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.5);
        }
        .card-front { transform: rotateY(180deg); background-color: #000; border: 1px solid #52525b; border-radius: 10px; }
        .card-front img { width: 100%; height: 100%; border-radius: 8px; object-fit: cover; }
        
        .result-card-static {
            width: 160px; height: 274px; margin: 0 auto 15px auto; background-color: #000; border: 1px solid #52525b; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.9); overflow: hidden; box-sizing: border-box;
        }
        .result-card-static img { width: 100%; height: 100%; object-fit: cover; }
        .reversed { transform: rotate(180deg); }
        
        .result-info { font-size: 13px; line-height: 1.6; padding: 5px; box-sizing: border-box; color: #a1a1aa; text-align: left; margin-top: 10px; }
        .card-title-en { display: block; color: #ffffff; font-size: 14px; font-weight: 700; margin-top: 5px; }
        .card-title-cn { display: block; color: #a1a1aa; font-size: 12px; margin-top: 2px; margin-bottom: 5px; }
        
        .orientation { font-weight: bold; margin: 5px 0; font-size: 11px; }
        .upright-text { color: #10b981; }
        .reversed-text { color: #ef4444; }
        
        .summary-box {
            max-width: 600px; margin: 30px auto; background: #0d0d0d; border: 1px dashed #dc2626; padding: 25px; border-radius: 12px; text-align: left; line-height: 1.8; box-sizing: border-box;
        }
        .summary-box h2 { color: #ffffff; text-align: center; margin-top: 0; font-size: 15px; letter-spacing: 2px; border-bottom: 1px solid #1f1f1f; padding-bottom: 10px; }
        .summary-box p { margin: 15px 0 0 0; font-size: 13px; color: #d1d1d1; text-indent: 2em; }

        #capture-node { padding: 15px; background: #050505; border-radius: 16px; }
        .result-title-node {
            font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 20px; border-left: 3px solid #dc2626; padding-left: 10px; text-align: left; line-height: 1.5;
        }

        .action-container { margin: 30px auto 10px auto; display: flex; flex-direction: column; align-items: center; gap: 15px; max-width: 420px; width: 100%; box-sizing: border-box; }
        .sub-btn-group { display: flex; gap: 15px; justify-content: center; width: 100%; }
        .sub-btn-group button { flex: 1; padding: 14px 0; }
        .btn-alignment-wide { width: 100%; }
        
        button { 
            background-color: #0a0a0a; color: #d1d1d1; border: 1px solid #27272a; padding: 14px 40px; font-size: 13px; font-weight: bold; border-radius: 9999px; cursor: pointer; transition: 0.2s; font-family: inherit; letter-spacing: 0.1em;
        }
        button:hover { background-color: #111; border-color: #dc2626; color: #fff; }
        
        .btn-primary { background-color: #dc2626; color: #fff; border-color: #dc2626; }
        .btn-primary:hover { background-color: #b91c1c; border-color: #b91c1c; }
        .btn-secondary { background-color: #050505; border-color: #3f3f46; color: #a1a1aa; }
        .btn-secondary:hover { border-color: #71717a; color: #fff; }

        .view-node { display: none; }
        .view-node.active-node { display: block; }

        footer { font-size: 10px; color: #444446; margin-top: 60px; border-top: 1px solid #141416; padding-top: 20px; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="main-content">
        <h1>🔮 聖三角潛意識矩陣占卜</h1>
        <div class="sys-status">SYS_STATUS: ACTIVE // NODE_TAROT</div>
        
        <div id="home-view" class="view-node active-node panel-section">
            <div class="intro-text">
                <p>歡迎來到聖三角潛意識量子矩陣。本系統基於經典神祕學「三位一體」時間軸模型，引導你映射內心的真實流動。</p>
            </div>
            <button class="btn-primary" onclick="playSound('click'); switchView('divination-view')">進入占卜矩陣 // ENTER</button>
        </div>

        <div id="divination-view" class="view-node panel-section">
            <label for="question">[ INITIALIZE_INPUT ] 請輸入你的問題並在心中默想3次：</label>
            <input type="text" id="question" placeholder="輸入你想解構的潛意識流動..." maxlength="20">
            
            <label for="question-type">[ SELECT_MATRIX_NODE ] 請選擇占卜類別：</label>
            <select id="question-type">
                <option value="general">綜合運勢分析 // GENERAL</option>
                <option value="love">感情桃花發展 // LOVE</option>
                <option value="work">工作學業事業 // WORK</option>
            </select>
            <br>
            <button id="draw-btn" class="btn-primary" onclick="startTarotSession()">開始洗牌占卜 // RUN</button>

            <div id="user-question-display"></div>
            <div id="flow-hint"></div>
            <div id="deck" class="container"></div>
        </div>

        <div id="result-view" class="view-node panel-section">
            <div id="capture-node">
                <div id="result-question-title" class="result-title-node"></div>
                <div id="result-deck-display" class="container"></div>
                <div id="summary-section" class="summary-box"></div>
            </div>

            <div class="action-container">
                <button class="btn-secondary btn-alignment-wide" onclick="playSound('click'); resetToHome()">🔙 返回主頁 // HOME</button>
                <div class="sub-btn-group">
                    <button class="btn-secondary" onclick="playSound('click'); switchView('divination-view'); resetDivinationEngine();">🔄 重新占卜 // RETRY</button>
                    <button class="btn-primary" onclick="generateCardAndRedirect()">📸 生成小卡 // SAVE</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>⚡ 系統宣告 // Disclaimer</p>
    </footer>

    <script>
        // ==================== 頂級優化科幻音效引擎 ====================
        const AudioEngine = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type, step = 0) {
            if (AudioEngine.state === 'suspended') { AudioEngine.resume(); }
            const now = AudioEngine.currentTime;
            
            // 原本清脆、好聽的按鈕專屬點擊音效
            if (type === 'click') {
                const osc = AudioEngine.createOscillator();
                const gain = AudioEngine.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.connect(gain); gain.connect(AudioEngine.destination);
                osc.start(now); osc.stop(now + 0.05);
            } 
            // 洗牌：清脆的高級數位晶片嗶聲
            else if (type === 'shuffle_tick') {
                const osc = AudioEngine.createOscillator();
                const filter = AudioEngine.createBiquadFilter();
                const gain = AudioEngine.createGain();
                
                osc.type = 'sine';
                let freq = 1600 + (step * 250);
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq - 600, now + 0.05);
                
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(freq, now);
                
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(AudioEngine.destination);
                osc.start(now); osc.stop(now + 0.05);
            } 
            // 翻牌：大氣、具有未來感的全息螢幕展開聽感
            else if (type === 'flip') {
                const oscBase = AudioEngine.createOscillator();
                const oscTop = AudioEngine.createOscillator();
                const gain = AudioEngine.createGain();
                
                let baseFreq = 329.63; // E4
                if (step === 1) baseFreq = 392.00; // G4
                if (step === 2) baseFreq = 523.25; // C5
                
                oscBase.type = 'triangle';
                oscBase.frequency.setValueAtTime(baseFreq, now);
                oscBase.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, now + 0.3);
                
                oscTop.type = 'sine';
                oscTop.frequency.setValueAtTime(baseFreq * 2, now);
                oscTop.frequency.exponentialRampToValueAtTime(baseFreq * 4, now + 0.25);
                
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                
                oscBase.connect(gain);
                oscTop.connect(gain);
                gain.connect(AudioEngine.destination);
                
                oscBase.start(now); oscTop.start(now);
                oscBase.stop(now + 0.35); oscTop.stop(now + 0.35);
            }
            // 錯誤提示音
            else if (type === 'error') {
                const osc = AudioEngine.createOscillator();
                const gain = AudioEngine.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(140, now);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain); gain.connect(AudioEngine.destination);
                osc.start(now); osc.stop(now + 0.15);
            }
            // 成功提示音
            else if (type === 'success') {
                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((freq, index) => {
                    const osc = AudioEngine.createOscillator();
                    const gain = AudioEngine.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + index * 0.05);
                    gain.gain.setValueAtTime(0.06, now + index * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.002, now + index * 0.05 + 0.15);
                    osc.connect(gain); gain.connect(AudioEngine.destination);
                    osc.start(now + index * 0.05); osc.stop(now + index * 0.05 + 0.15);
                });
            }
            // 截圖提示音
            else if (type === 'capture') {
                const osc = AudioEngine.createOscillator();
                const gain = AudioEngine.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1800, now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain); gain.connect(AudioEngine.destination);
                osc.start(now); osc.stop(now + 0.08);
            }
        }

        // ==================== 占卜主邏輯 ====================
        const tarotData = {
          "cards": [
            { "name": "The Fool", "img": "m00.jpg" },
            { "name": "The Magician", "img": "m01.jpg" },
            { "name": "The High Priestess", "img": "m02.jpg" },
            { "name": "The Empress", "img": "m03.jpg" },
            { "name": "The Emperor", "img": "m04.jpg" }
          ]
        };

        const tarotMeanings = {
            "The Fool": { nameCN: "愚者", general: { upright: "新的開始、自由、冒險。", reversed: "魯莽、輕率、不負責任。" }, love: { upright: "一段充滿新鮮感的新戀情即將展開。", reversed: "感情中過度盲目。" }, work: { upright: "適合挑戰全新的領域。", reversed: "工作上缺乏規劃導致混難。" } },
            "The Magician": { nameCN: "魔術師", general: { upright: "創造力、行動力、潛力發揮。", reversed: "操縱、欺騙、計畫不踏實。" }, love: { upright: "關係中溝通流暢，充滿趣味。", reversed: "注意感情中的甜言蜜語背後是否隱瞞。" }, work: { upright: "展現強大工作能力的時期。", reversed: "空有才華卻缺乏執行力。" } },
            "The High Priestess": { nameCN: "女祭司", general: { upright: "直覺、潛意識、智慧、冷靜。", reversed: "膚淺、過度理性、壓抑情感。" }, love: { upright: "感情上較為被動、精神交流大於物質。", reversed: "情感壓抑過度導致隔閡。" }, work: { upright: "適合從事研究、企劃、分析等靜態工作。", reversed: "面對職場決策時過度猶豫不決。" } },
            "The Empress": { nameCN: "皇后", general: { upright: "豐收、繁榮、孕育、母愛。", reversed: "缺乏安全感、過度控制。" }, love: { upright: "感情生活充滿甜蜜與熱情，彼此包容。", reversed: "在關係中過度控制、佔有慾過強。" }, work: { upright: "職場發展順遂，努力將迎來實質的回報。", reversed: "工作流於安逸，缺乏積極度。" } },
            "The Emperor": { nameCN: "皇帝", general: { upright: "權力、穩定、控制、秩序。", reversed: "暴政、軟弱、控制狂。" }, love: { upright: "感情關係穩定、具有安全感。", reversed: "感情中一方過於專斷、固執。" }, work: { upright: "有望晉升主管職、建立制度。", reversed: "職場遇到僵化的體制。" } },
            "default": { nameCN: "未知卡牌", general: { upright: "事情正朝著積極的方向發展。", reversed: "當前可能面臨短暫的阻礙。" }, love: { upright: "感情方面請順應內心。", reversed: "情感可能出現短暫停滯。" }, work: { upright: "工作學業推進順利。", reversed: "發展受制於環境。" } }
        };

        let currentHandData = []; 
        let currentFlipIndex = 0; 
        let selectedType = 'general';

        function switchView(viewId) {
            document.querySelectorAll('.view-node').forEach(node => node.classList.remove('active-node'));
            document.getElementById(viewId).classList.add('active-node');
        }

        function resetDivinationEngine() {
            document.getElementById('question').value = '';
            document.getElementById('user-question-display').innerText = '';
            document.getElementById('flow-hint').innerText = '';
            document.getElementById('deck').innerHTML = '';
        }

        function resetToHome() {
            resetDivinationEngine();
            switchView('home-view');
        }

        function startTarotSession() {
            const questionInput = document.getElementById('question').value.trim();
            selectedType = document.getElementById('question-type').value;

            if (questionInput === "") {
                playSound('error');
                alert("🔮 占卜需要誠心，請先輸入你想問的問題喔！");
                return;
            }

            playSound('click'); 

            const typeNames = { 'general': '綜合運勢', 'love': '感情發展', 'work': '工作學業' };
            document.getElementById('user-question-display').innerText = `[ MATRIX_TARGET // ${typeNames[selectedType]} : ${questionInput} ]`;
            document.getElementById('flow-hint').innerText = "DECRYPTING_SUB_NODES...";
            
            initStaticDeck();
            
            currentFlipIndex = 0;
            const shuffled = [...tarotData.cards].sort(() => 0.5 - Math.random());
            currentHandData = shuffled.slice(0, 3).map(card => {
                return { ...card, isReversed: Math.random() < 0.5 };
            });
            
            runDigitalShuffle(); 
        }

        function initStaticDeck() {
            const deckDiv = document.getElementById('deck');
            deckDiv.innerHTML = '';
            const positions = ["過去 // PAST", "現在 // PRESENT", "未來 // FUTURE"];

            for (let i = 0; i < 3; i++) {
                const cardBox = document.createElement('div');
                cardBox.className = 'card-box';
                cardBox.innerHTML = `
                    <h3>${positions[i]}</h3>
                    <div class="card" id="card-${i}" onclick="handleCardFlip(${i})">
                        <div class="card-inner">
                            <div class="card-back">⚝</div>
                            <div class="card-front" id="front-slot-${i}"></div>
                        </div>
                    </div>
                `;
                deckDiv.appendChild(cardBox);
            }
        }

        function runDigitalShuffle() {
            let step = 0;
            
            const shuffleTimer = setInterval(() => {
                if (step < 3) {
                    const card = document.getElementById(`card-${step}`);
                    if (card) {
                        card.classList.add('scanning');
                        playSound('shuffle_tick', step); 
                    }
                    step++;
                } else {
                    clearInterval(shuffleTimer);
                    
                    setTimeout(() => {
                        currentHandData.forEach((card, i) => {
                            const cardEl = document.getElementById(`card-${i}`);
                            if (cardEl) cardEl.classList.remove('scanning');
                            
                            const slot = document.getElementById('front-slot-' + i);
                            if (slot) {
                                slot.innerHTML = `<img src="cards/${card.img}" class="${card.isReversed ? 'reversed' : ''}" alt="${card.name}">`;
                            }
                        });
                        unlockNextCard();
                    }, 300);
                }
            }, 250); 
        }

        function unlockNextCard() {
            if (currentFlipIndex < 3) {
                const targetCard = document.getElementById(`card-${currentFlipIndex}`);
                if (targetCard) targetCard.classList.add('playable');
                const posName = currentFlipIndex === 0 ? "過去" : (currentFlipIndex === 1 ? "現在" : "未來");
                document.getElementById('flow-hint').innerText = `👉 請點擊翻開【${posName}】數據節點`;
            } else {
                document.getElementById('flow-hint').innerText = "SYSTEM_SUCCESS // 矩陣分析完成...";
                playSound('success');
                setTimeout(() => { compileAndShowResultView(); }, 1000);
            }
        }

        function handleCardFlip(index) {
            const cardEl = document.getElementById(`card-${index}`);
            if (cardEl && cardEl.classList.contains('playable') && !cardEl.classList.contains('flipped')) {
                playSound('flip', index); 
                cardEl.classList.add('flipped');
                cardEl.classList.remove('playable');
                currentFlipIndex++;
                setTimeout(() => { unlockNextCard(); }, 600);
            }
        }

        function compileAndShowResultView() {
            const questionInput = document.getElementById('question').value.trim();
            const typeNames = { 'general': '綜合運勢', 'love': '感情發展', 'work': '工作學業' };
            document.getElementById('result-question-title').innerText = `[ 矩陣解構目標 // ${typeNames[selectedType]} : ${questionInput} ]`;
            
            const resultDeckDiv = document.getElementById('result-deck-display');
            resultDeckDiv.innerHTML = '';
            
            const positions = ["過去 // PAST", "現在 // PRESENT", "未來 // FUTURE"];
            currentHandData.forEach((card, index) => {
                const cardMeaning = tarotMeanings[card.name] || tarotMeanings["default"];
                const typeMeaning = cardMeaning[selectedType] || cardMeaning["general"];
                const explanation = card.isReversed ? typeMeaning.reversed : typeMeaning.upright;
                const orientationText = card.isReversed ? "逆位 // REVERSED" : "正位 // UPRIGHT";
                const orientationClass = card.isReversed ? "reversed-text" : "upright-text";

                const cardBox = document.createElement('div');
                cardBox.className = 'card-box';
                cardBox.innerHTML = `
                    <h3>${positions[index]}</h3>
                    <div class="result-card-static">
                        <img src="cards/${card.img}" class="${card.isReversed ? 'reversed' : ''}">
                    </div>
                    <div class="result-info">
                        <span class="card-title-en">${card.name}</span>
                        <span class="card-title-cn">${cardMeaning.nameCN}</span>
                        <div class="orientation ${orientationClass}">${orientationText}</div>
                        <p style="margin:5px 0; font-size:12px;">${explanation}</p>
                    </div>
                `;
                resultDeckDiv.appendChild(cardBox);
            });

            generateComprehensiveSummary();
            switchView('result-view');
        }

        // ==================== 【修復重點】：還原深度綜合分析結論邏輯 ====================
        function generateComprehensiveSummary() {
            // 1. 提取抽到的三張牌與其正逆位狀態
            const pCard = currentHandData[0];
            const prCard = currentHandData[1];
            const fCard = currentHandData[2];

            const pName = (tarotMeanings[pCard.name] || tarotMeanings["default"]).nameCN + (pCard.isReversed ? "逆位" : "正位");
            const prName = (tarotMeanings[prCard.name] || tarotMeanings["default"]).nameCN + (prCard.isReversed ? "逆位" : "正位");
            const fName = (tarotMeanings[fCard.name] || tarotMeanings["default"]).nameCN + (fCard.isReversed ? "逆位" : "正位");

            // 2. 計算總體正位率來決定大方向基調
            const totalUprights = currentHandData.filter(c => !c.isReversed).length; 
            
            let introText = "";
            let coreAnalysis = "";
            let adviceText = "";

            if (totalUprights === 3) {
                introText = `本次矩陣解構呈現極為罕見且強大的全正位線性流動。從過去的【${pName}】到現在的【${prName}】，你的潛意識能量一直處於高速擴張的狀態。`;
                coreAnalysis = `這代表你當前詢問的事情，脈絡極其清晰，外界的干擾非常微弱。隨著未來的【${fName}】落座，這股正向動能將會順理成章地推向高潮。`;
                adviceText = "此時不需要任何一絲猶豫。信任你的直覺，配合你現有的資源與行動力，大膽地向前推進，果斷做出決策。";
            } else if (totalUprights === 2) {
                introText = `矩陣分析顯示，整體局勢正朝著積極的方向靠攏。雖然在時間軸的某個節點上伴隨著些微的遲滯或調整，但主流能量仍由正位牌主導。`;
                coreAnalysis = `過去、現在、未來三節點中，【${pName}】與【${prName}】相互交織，顯示出雖然有一些盲點或過去殘留的課題需要消化，但並不足以阻擋未來的【${fName}】所帶來的全新氣象。`;
                adviceText = "建議保持現有的步調，並對目前的計劃進行微調。不需要大刀闊斧的改變，只需要保持耐心，當前的微小阻礙自然會迎刃而解。";
            } else if (totalUprights === 1) {
                introText = `當前牌陣中出現了較多的逆位能量，這是一份來自潛意識的深度提醒。目前的局勢中隱藏著較多的制約、焦慮或是能量受阻的情況。`;
                coreAnalysis = `雖然有【${pName}】或【${prName}】其中一者試圖提供支撐，但從整體時間軸來看，逆位的張力壓過了前進的動能，這意味著內部盲點或外界環境帶來的拉扯正處於高峰期。`;
                adviceText = "目前不宜盲目推展與強求結果。建議先將焦點從外在轉回內心，停下腳步沉澱情緒。徹底找出當前的核心盲點進行整頓，才是突破僵局的唯一解法。";
            } else {
                introText = `三數據節點全數呈現逆位（【${pName}】➔【${prName}】➔【${fName}】）。這意味著當前的潛意識矩陣正經歷著一場徹底的重組與能量低潮。`;
                coreAnalysis = `這並非全然的壞事，而是局勢在強烈暗示：你過去習慣的應對模式或思考方向已經完全行不通了。內在的壓抑、混亂或是外界的巨大阻力此時正交織在一起。`;
                adviceText = "這是最需要徹底放手與臣服的時刻。請立刻停止所有高風險的試探或勉強的行動，給自己充足的時間進行內部大掃除，等待矩陣能量重新自我修復。";
            }
            
            const summaryDiv = document.getElementById('summary-section');
            summaryDiv.innerHTML = `
                <h2>🔮 [ 綜合矩陣點評 ]</h2>
                <p>${introText}</p>
                <p>${coreAnalysis}</p>
                <p>${adviceText}</p>
            `;
        }

        function generateCardAndRedirect() {
            playSound('capture');
            const targetNode = document.getElementById('capture-node');
            
            html2canvas(targetNode, {
                backgroundColor: "#050505",
                scale: 2, 
                useCORS: true
            }).then(canvas => {
                const image = canvas.toDataURL("image/png");
                const link = document.createElement('a');
                link.download = 'Tarot-Matrix-Report.png';
                link.href = image;
                link.click();
                setTimeout(() => { window.location.href = "https://s.shopee.tw/40eMd6bUyk"; }, 1000);
            }).catch(err => {
                window.location.href = "https://s.shopee.tw/40eMd6bUyk";
            });
        }
    </script>
