<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔羅占卜矩陣 // TAROT_MATRIX</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #0f0f13;
            --border-color: #2a2a35;
            --accent-color: #a582e3;
            --text-color: #e0e0e6;
            --text-dim: #888898;
            --font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .view-node {
            display: none;
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 25px 20px;
            flex-direction: column;
            background: var(--bg-color);
        }
        .view-node.active-node {
            display: flex;
        }

        .matrix-header {
            text-align: center;
            margin-bottom: 35px;
            padding-top: 20px;
        }
        .matrix-title {
            font-size: 20px;
            letter-spacing: 5px;
            color: var(--text-color);
            font-weight: 600;
            text-transform: uppercase;
        }
        .matrix-subtitle {
            font-size: 10px;
            color: var(--accent-color);
            letter-spacing: 2px;
            margin-top: 6px;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-label {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }
        select, textarea {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 14px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }
        select:focus, textarea:focus {
            border-color: var(--accent-color);
        }
        textarea {
            height: 110px;
            resize: none;
            line-height: 1.5;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 16px;
            border-radius: 6px;
            font-size: 13px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            margin-top: 10px;
            text-align: center;
        }
        .action-btn:hover, .action-btn:active {
            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(165, 130, 227, 0.4);
        }

        .info-bar {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        #user-question-display { color: var(--accent-color); margin-bottom: 4px; font-weight: bold; }
        #flow-hint { color: var(--text-dim); }

        .slots-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 35px;
        }
        .slot-box {
            background: var(--panel-bg);
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            aspect-ratio: 2 / 3.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            color: var(--text-dim);
            position: relative;
        }

        .pile-stage {
            flex-grow: 1;
            position: relative;
            min-height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pile-master {
            position: relative;
            width: 84px;
            height: 134px;
        }

        .scroller-wrapper {
            position: relative;
            width: 100%;
            margin-top: auto;
            margin-bottom: 20px;
            display: none;
        }
        .fan-scroller {
            width: 100%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            padding: 20px 0 40px 0;
        }
        .fan-scroller::-webkit-scrollbar { display: none; }
        
        .spread-fan-stage {
            display: flex;
            padding: 0 calc(50% - 42px);
            gap: 15px;
            width: max-content;
            align-items: center;
            transition: opacity 0.5s;
        }

        .card {
            width: 84px;
            height: 134px;
            position: absolute;
            perspective: 1000px;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .spread-fan-stage .card {
            position: relative;
            scroll-snap-align: center;
            flex-shrink: 0;
            transform-origin: center bottom;
        }
        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        .card-back, .card-front {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 6px;
            overflow: hidden;
        }
        .card-back {
            background: #13131a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid rgba(165, 130, 227, 0.2);
        }
        .tarot-symbol {
            font-size: 24px;
            color: var(--accent-color);
            opacity: 0.7;
        }
        .card-front {
            background: #000;
            transform: rotateY(180deg);
        }
        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-front img.reversed {
            transform: rotate(180deg);
        }

        .card-in-slot {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
        }
        .card-in-slot.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .selected-fly {
            opacity: 0 !important;
            pointer-events: none;
            transition: all 0.4s ease;
        }

        .scroller-nav {
            display: flex;
            justify-content: space-between;
            position: absolute;
            top: 50%;
            width: 100%;
            transform: translateY(-50%);
            pointer-events: none;
            padding: 0 5px;
            z-index: 150;
        }
        .nav-arrow {
            width: 32px;
            height: 32px;
            background: rgba(15, 15, 19, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
            pointer-events: auto;
        }

        .result-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .result-card-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        .result-card-box h3 {
            font-size: 12px;
            color: var(--accent-color);
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .result-card-static {
            width: 90px;
            height: 144px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-bottom: 15px;
            background: #000;
        }
        .result-card-static img { width: 100%; height: 100%; object-fit: cover; }
        .result-card-static img.reversed { transform: rotate(180deg); }

        .result-info { display: flex; flex-direction: column; gap: 4px; }
        .card-title-en { font-size: 16px; font-weight: bold; letter-spacing: 0.5px; }
        .card-title-cn { font-size: 14px; color: var(--text-dim); }
        .orientation { font-size: 11px; margin: 6px 0; font-weight: bold; letter-spacing: 1px;}
        .upright-text { color: #8ce7a6; }
        .reversed-text { color: #f38383; }
        .card-desc-text { font-size: 13px; line-height: 1.6; color: #c4c4d0; margin-top: 4px; text-align: justify;}

        .summary-box {
            background: var(--panel-bg);
            border: 1px solid rgba(165, 130, 227, 0.3);
            border-radius: 8px;
            padding: 20px;
            margin-top: 10px;
        }
        .summary-box h2 { font-size: 14px; color: var(--accent-color); margin-bottom: 12px; letter-spacing: 1px; }
        .summary-box p { font-size: 13px; line-height: 1.7; color: #c4c4d0; margin-bottom: 10px; text-align: justify; }
        .summary-box p:last-child { margin-bottom: 0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <!-- 1. 初始輸入首頁 -->
    <div id="home-view" class="view-node active-node">
        <div class="matrix-header">
            <h1 class="matrix-title">意識矩陣占卜</h1>
            <p class="matrix-subtitle">TAROT MATRIX SYSTEM</p>
        </div>
        <div class="input-group">
            <label class="input-label">選擇解構維度 // SELECT DIMENSION</label>
            <select id="question-type">
                <option value="general">綜合運勢 // GENERAL_FLOW</option>
                <option value="love">感情發展 // LOVE_MATRIX</option>
                <option value="work">工作學業 // CAREER_CORE</option>
            </select>
        </div>
        <div class="input-group">
            <label class="input-label">輸入你的困惑 // INPUT SUB_CONSCIOUS_DATA</label>
            <textarea id="question" placeholder="請誠心默想並輸入你想問的問題...（例如：未來三個月的感情發展？）"></textarea>
        </div>
        <button class="action-btn" onclick="startTarotShuffle()">進入占卜矩陣 // ENTER</button>
    </div>

    <!-- 2. 洗牌與抽牌核心視圖 -->
    <div id="shuffle-view" class="view-node">
        <div class="info-bar">
            <div id="user-question-display"></div>
            <div id="flow-hint">⚡ 系統初始化中...</div>
        </div>

        <div class="slots-container">
            <div class="slot-box"><span>過去</span><div id="slot-0"></div></div>
            <div class="slot-box"><span>現在</span><div id="slot-1"></div></div>
            <div class="slot-box"><span>未來</span><div id="slot-2"></div></div>
        </div>

        <div class="pile-stage">
            <div class="pile-master" id="pile-master"></div>
        </div>

        <div class="scroller-wrapper" id="scroller-wrapper">
            <div class="scroller-nav">
                <div class="nav-arrow" onclick="scrollCarousel('left')">◀</div>
                <div class="nav-arrow" onclick="scrollCarousel('right')">▶</div>
            </div>
            <div class="fan-scroller" id="fan-scroller">
                <div class="spread-fan-stage" id="spread-fan-stage"></div>
            </div>
        </div>
    </div>

    <!-- 3. 結果解讀報表頁 -->
    <div id="result-view" class="view-node">
        <div id="capture-node" style="padding: 10px; background: #050505;">
            <div class="matrix-header">
                <h1 class="matrix-title">矩陣解構報告</h1>
                <p class="matrix-subtitle" id="result-question-title"></p>
            </div>
            <div class="result-wrapper" id="result-deck-display"></div>
            <div class="summary-box" id="summary-section"></div>
        </div>
        <button class="action-btn" style="margin-top: 30px;" onclick="generateCardAndRedirect()">封存矩陣並導向 // EXPORT_DATA</button>
        <button class="action-btn" style="border-color:#444; color:#888; margin-top:10px;" onclick="resetToHome()">重新注入能量 // REBOOT</button>
    </div>

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.view-node').forEach(n => n.classList.remove('active-node'));
            const target = document.getElementById(viewId);
            if (target) target.classList.add('active-node');
        }

        let AudioEngine = null;
        function safeUnlockSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                if (!AudioEngine) AudioEngine = new AudioCtx();
                if (AudioEngine.state === 'suspended') AudioEngine.resume();
                playSound('click');
            } catch(e){}
        }

        function playSound(type, step = 0) {
            try {
                if (!AudioEngine) return;
                const now = AudioEngine.currentTime;
                if (type === 'click') {
                    const osc = AudioEngine.createOscillator(); const gain = AudioEngine.createGain();
                    osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now); osc.connect(gain); gain.connect(AudioEngine.destination); osc.start(now); osc.stop(now + 0.05);
                } else if (type === 'shuffle_tick') {
                    const osc = AudioEngine.createOscillator(); const gain = AudioEngine.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(120 + Math.random()*50, now); gain.gain.setValueAtTime(0.08, now);
                    osc.connect(gain); gain.connect(AudioEngine.destination); osc.start(now); osc.stop(now + 0.04);
                } else if (type === 'flip') {
                    const osc = AudioEngine.createOscillator(); const gain = AudioEngine.createGain();
                    osc.frequency.setValueAtTime(300 + step*100, now); osc.frequency.exponentialRampToValueAtTime(150, now + 0.3);
                    gain.gain.setValueAtTime(0.1, now); osc.connect(gain); gain.connect(AudioEngine.destination); osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'success') {
                    [523.25, 659.25, 783.99].forEach((f, i) => {
                        const osc = AudioEngine.createOscillator(); const gain = AudioEngine.createGain();
                        osc.frequency.setValueAtTime(f, now + i*0.08); gain.gain.setValueAtTime(0.05, now + i*0.08);
                        osc.connect(gain); gain.connect(AudioEngine.destination); osc.start(now + i*0.08); osc.stop(now + i*0.08 + 0.2);
                    });
                }
            } catch(e) {}
        }

        // 78 張完整的塔羅牌定義數據
        const tarotCardsPool = [
            /* 大阿爾克那 22張 */
            { name: "The Fool", img: "m00.jpg" }, { name: "The Magician", img: "m01.jpg" },

            { name: "The Hanged Man", img: "m12.jpg" }, { name: "Death", img: "m13.jpg" },
            { name: "Temperance", img: "m14.jpg" }, { name: "The Devil", img: "m15.jpg" },
            { name: "The Tower", img: "m16.jpg" }, { name: "The Star", img: "m17.jpg" },
            { name: "The Moon", img: "m18.jpg" }, { name: "The Sun", img: "m19.jpg" },
            { name: "Judgement", img: "m20.jpg" }, { name: "The World", img: "m21.jpg" },
            /* 權杖 wands 14張 */
            { name: "Ace of Wands", img: "w01.jpg" }, { name: "Two of Wands", img: "w02.jpg" },
            { name: "Three of Wands", img: "w03.jpg" }, { name: "Four of Wands", img: "w04.jpg" },
            { name: "Five of Wands", img: "w05.jpg" }, { name: "Six of Wands", img: "w06.jpg" },
            { name: "Seven of Wands", img: "w07.jpg" }, { name: "Eight of Wands", img: "w08.jpg" },
            { name: "Nine of Wands", img: "w09.jpg" }, { name: "Ten of Wands", img: "w10.jpg" },
            { name: "Page of Wands", img: "w11.jpg" }, { name: "Knight of Wands", img: "w12.jpg" },
            { name: "Queen of Wands", img: "w13.jpg" }, { name: "King of Wands", img: "w14.jpg" },
            /* 聖杯 cups 14張 */
            { name: "Ace of Cups", img: "c01.jpg" }, { name: "Two of Cups", img: "c02.jpg" },
            { name: "Three of Cups", img: "c03.jpg" }, { name: "Four of Cups", img: "c04.jpg" },
            { name: "Five of Cups", img: "c05.jpg" }, { name: "Six of Cups", img: "c06.jpg" },
            { name: "Seven of Cups", img: "c07.jpg" }, { name: "Eight of Cups", img: "c08.jpg" },
            { name: "Nine of Cups", img: "c09.jpg" }, { name: "Ten of Cups", img: "c10.jpg" },
            { name: "Page of Cups", img: "c11.jpg" }, { name: "Knight of Cups", img: "c12.jpg" },

            { name: "Ace of Swords", img: "s01.jpg" }, { name: "Two of Swords", img: "s02.jpg" },

            { name: "Nine of Swords", img: "s09.jpg" }, { name: "Ten of Swords", img: "s10.jpg" },
            { name: "Page of Swords", img: "s11.jpg" }, { name: "Knight of Swords", img: "s12.jpg" },
            { name: "Queen of Swords", img: "s13.jpg" }, { name: "King of Swords", img: "s14.jpg" },
            /* 錢幣 pentacles 14張 */
            { name: "Ace of Pentacles", img: "p01.jpg" }, { name: "Two of Pentacles", img: "p02.jpg" },
            { name: "Three of Pentacles", img: "p03.jpg" }, { name: "Four of Pentacles", img: "p04.jpg" },
            { name: "Five of Pentacles", img: "p05.jpg" }, { name: "Six of Pentacles", img: "p06.jpg" },
            { name: "Seven of Pentacles", img: "p07.jpg" }, { name: "Eight of Pentacles", img: "p08.jpg" },
            { name: "Nine of Pentacles", img: "p09.jpg" }, { name: "Ten of Pentacles", img: "p10.jpg" },
            { name: "Page of Pentacles", img: "p11.jpg" }, { name: "Knight of Pentacles", img: "p12.jpg" },
            { name: "Queen of Pentacles", img: "p13.jpg" }, { name: "King of Pentacles", img: "p14.jpg" }
        ];

        let processedDeck = []; 
        let selectedHand = []; 
        let currentSlotIndex = 0; 
        let selectedType = 'general';
        let isShuffling = false;
        let isDown = false;
        let startX;
        let scrollLeft;
        let isDragging = false;
        
        function resetDivinationEngine() {
            document.getElementById('question').value = '';
            document.getElementById('user-question-display').innerText = '';
            document.getElementById('flow-hint').innerText = '';
            document.getElementById('pile-master').innerHTML = '';
            document.getElementById('pile-master').style.display = 'block';
            document.getElementById('scroller-wrapper').style.display = 'none';
            document.getElementById('spread-fan-stage').innerHTML = '';
            document.getElementById('spread-fan-stage').style.opacity = '0';
            for(let i=0; i<3; i++) document.getElementById(`slot-${i}`).innerHTML = '等待選牌';
            selectedHand = []; currentSlotIndex = 0; isShuffling = false;
        }
        function resetToHome() { resetDivinationEngine(); switchView('home-view'); }

        function startTarotShuffle() {
            const questionInput = document.getElementById('question').value.trim();
            selectedType = document.getElementById('question-type').value;
            if (questionInput === "") { alert("🔮 占卜需要誠心，請先輸入你想問的問題喔！"); return; }
            if (isShuffling) return;
            
            isShuffling = true;
            try { safeUnlockSound(); } catch(e){}
            switchView('shuffle-view');
            
            const typeNames = { 'general': '綜合運勢', 'love': '感情發展', 'work': '工作學業' };
            document.getElementById('user-question-display').innerText = `[ 矩陣目標 // ${typeNames[selectedType]} : ${questionInput} ]`;
            document.getElementById('flow-hint').innerText = "⚡ 正在串聯潛意識能量節點...";
            
            document.getElementById('pile-master').style.display = 'block';
            document.getElementById('scroller-wrapper').style.display = 'none';
            
            const pile = document.getElementById('pile-master'); pile.innerHTML = '';
            // 動態生成 30 張示意牌堆
            for(let i=0; i<30; i++) {
                const pCard = document.createElement('div'); pCard.className = 'card';
                pCard.style.top = `-${i * 1.2}px`; pCard.style.left = `${i * 0.1}px`;
                pCard.innerHTML = `<div class="card-inner"><div class="card-back"><div class="tarot-symbol">⚝</div></div></div>`;
                pile.appendChild(pCard);
            }

            // 78 張牌洗牌
            let poolCopy = [...tarotCardsPool].sort(() => 0.5 - Math.random());
            processedDeck = poolCopy.map(c => ({ ...c, isReversed: Math.random() < 0.5 }));

            setTimeout(() => {
                document.getElementById('flow-hint').innerText = "⚡ 全套 78 張潛意識矩陣清洗中 (CORE_SHUFFLING)...";
                let startTime = performance.now(); let duration = 2000; let lastTick = 0;
                const pileCards = pile.querySelectorAll('.card');

                const physicsShuffle = (now) => {
                    let elapsed = now - startTime;
                    if(elapsed < duration) {
                        if (now - lastTick > 80) { try { playSound('shuffle_tick'); } catch(e){} lastTick = now; }
                        pileCards.forEach((c, idx) => {
                            let offsetX = 40 * Math.sin(now * 0.025 + idx);
                            let offsetY = (idx * -1.2) + (12 * Math.cos(now * 0.02 + idx));
                            c.style.transform = `translate(${offsetX}px, ${offsetY}px) rotate(${10 * Math.sin(now * 0.01 + idx)}deg)`;
                        });
                        requestAnimationFrame(physicsShuffle);
                    } else {
                        pileCards.forEach((c, idx) => c.style.transform = `translate(0px, -${idx * 1.2}px) rotate(0deg)`);
                        setTimeout(() => spread3DCarouselDeck(), 300);
                    }
                };
                requestAnimationFrame(physicsShuffle);
            }, 600);
        }

        function getCardOffsetFromCenter(card) {
            const scroller = document.getElementById('fan-scroller');
            if(!scroller) return 0;
            const scrollerCenter = scroller.getBoundingClientRect().left + (scroller.offsetWidth / 2);
            return (card.getBoundingClientRect().left + (card.offsetWidth / 2)) - scrollerCenter;
        }

        function spread3DCarouselDeck() {
            document.getElementById('pile-master').style.display = 'none';
            document.getElementById('scroller-wrapper').style.display = 'block';
            
            const stage = document.getElementById('spread-fan-stage'); 
            const scroller = document.getElementById('fan-scroller');
            stage.innerHTML = ''; stage.style.display = 'flex';
            
            document.getElementById('flow-hint').innerText = `👉 請左右滑動，點擊中央焦點牌盲抽 【過去 // PAST】`;

            processedDeck.forEach((cardData, index) => {
                const cardEl = document.createElement('div'); 
                cardEl.className = 'card'; 
                cardEl.setAttribute('id', `deck-card-${index}`);
                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-back">
                            <div style="font-size: 9px; opacity: 0.4; letter-spacing: 1px;">TAROT</div>
                            <div style="flex-grow: 1; display: flex; align-items: center;" class="tarot-symbol">⚝</div>
                            <div style="font-size: 8px; opacity: 0.3;">${index + 1}</div>
                        </div>
                    </div>`;
                
                cardEl.onclick = () => {
                    if (isDragging) return; 
                    if(cardEl.classList.contains('is-focused') || Math.abs(getCardOffsetFromCenter(cardEl)) < 50) {
                        selectCardFromCarousel(index);
                    } else {
                        cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    }
                };
                stage.appendChild(cardEl);
            });
            
            setTimeout(() => {
                stage.style.opacity = '1';
                scroller.addEventListener('scroll', updateCarouselFocusEffects);
                initializeMouseDragScroll(scroller);
                
                const midCard = document.getElementById(`deck-card-38`);
                if(midCard) midCard.scrollIntoView({ block: 'nearest', inline: 'center' });
                updateCarouselFocusEffects();
            }, 50);
        }

        function initializeMouseDragScroll(scroller) {
            scroller.addEventListener('mousedown', (e) => {
                isDown = true; isDragging = false;
                scroller.style.scrollSnapType = 'none'; 
                startX = e.pageX - scroller.offsetLeft;
                scrollLeft = scroller.scrollLeft;
            });
            scroller.addEventListener('mouseleave', () => {
                if (!isDown) return;
                isDown = false; scroller.style.scrollSnapType = 'x mandatory'; 
            });
            scroller.addEventListener('mouseup', () => {
                isDown = false; scroller.style.scrollSnapType = 'x mandatory'; 
                setTimeout(() => { isDragging = false; }, 50);
            });
            scroller.addEventListener('mousemove', (e) => {
                if(!isDown) return;
                e.preventDefault();
                const x = e.pageX - scroller.offsetLeft;
                const walk = (x - startX) * 1.5; 
                if (Math.abs(walk) > 5) isDragging = true; 
                scroller.scrollLeft = scrollLeft - walk;
            });
        }

        function scrollCarousel(direction) {
            const scroller = document.getElementById('fan-scroller');
            const step = (84 + 15) * 2; 
            scroller.scrollBy({ left: direction === 'left' ? -step : step, behavior: 'smooth' });
        }

        function updateCarouselFocusEffects() {
            const scroller = document.getElementById('fan-scroller');
            const cards = document.querySelectorAll('.spread-fan-stage .card');
            if(!scroller || cards.length === 0) return;
            const scrollerCenter = scroller.getBoundingClientRect().left + (scroller.offsetWidth / 2);

            cards.forEach(card => {
                if(card.classList.contains('selected-fly')) return;
                const cardCenter = card.getBoundingClientRect().left + (card.offsetWidth / 2);
                const distanceFromCenter = cardCenter - scrollerCenter;
                const absDistance = Math.abs(distanceFromCenter);

                if (absDistance < 50) {
                    card.style.transform = `scale(1.15) translateY(-18px) rotate(0deg)`;
                    card.style.opacity = `1`; card.style.zIndex = `100`;
                    card.classList.add('is-focused');
                } else if (absDistance >= 50 && absDistance < 130) {
                    card.style.transform = `scale(0.95) translateY(-5px) rotate(${distanceFromCenter > 0 ? 8 : -8}deg)`;
                    card.style.opacity = `0.85`; card.style.zIndex = `50`;
                    card.classList.remove('is-focused');
                } else if (absDistance >= 130 && absDistance < 220) {
                    card.style.transform = `scale(0.75) translateY(10px) rotate(${distanceFromCenter > 0 ? 16 : -16}deg)`;
                    card.style.opacity = `0.4`; card.style.zIndex = `20`;
                    card.classList.remove('is-focused');
                } else {
                    card.style.transform = `scale(0.5) translateY(25px) rotate(${distanceFromCenter > 0 ? 24 : -24}deg)`;
                    card.style.opacity = `0.02`; card.style.zIndex = `1`;
                    card.classList.remove('is-focused');
                }
            });
        }

        function selectCardFromCarousel(index) {
            if (currentSlotIndex >= 3) return;
            const targetCard = document.getElementById(`deck-card-${index}`);
            if (!targetCard || targetCard.classList.contains('selected-fly')) return;

            try { playSound('flip', currentSlotIndex); } catch(e){}
            const cardData = processedDeck[index]; selectedHand.push(cardData);
            targetCard.classList.add('selected-fly');
            
            const currentSlot = document.getElementById(`slot-${currentSlotIndex}`);
            currentSlot.innerHTML = `<div class="card card-in-slot flipped"><div class="card-inner"><div class="card-back"><div class="tarot-symbol">⚝</div></div><div class="card-front"><img src="cards/${cardData.img}" class="${cardData.isReversed ? 'reversed' : ''}"></div></div></div>`;

            currentSlotIndex++;
            if (currentSlotIndex === 1) {
                document.getElementById('flow-hint').innerText = `👉 請繼續滑動，點擊中央焦點牌盲抽 【現在 // PRESENT】`;
            } else if (currentSlotIndex === 2) {
                document.getElementById('flow-hint').innerText = `👉 請繼續滑動，點擊中央焦點牌盲抽 【未來 // FUTURE】`;
            } else {
                document.getElementById('flow-hint').innerText = "SYSTEM_SUCCESS // 全要素核心矩陣封裝完成...";
                try { playSound('success'); } catch(e){}
                setTimeout(() => compileAndShowResultView(), 1000);
            }
            setTimeout(() => updateCarouselFocusEffects(), 200);
        }

        function compileAndShowResultView() {
            const questionInput = document.getElementById('question').value.trim();
            const typeNames = { 'general': '綜合運勢', 'love': '感情發展', 'work': '工作學業' };
            document.getElementById('result-question-title').innerText = `[ 矩陣解構目標 // ${typeNames[selectedType]} : ${questionInput} ]`;
            
            const resultDeckDiv = document.getElementById('result-deck-display'); resultDeckDiv.innerHTML = '';
            const positions = ["過去 // PAST", "現在 // PRESENT", "未來 // FUTURE"];
            
            const meaningsPool = getDynamicTarotMeanings();

            selectedHand.forEach((card, index) => {
                // 如果是未定義的小牌，動態生成兜底兜底解釋，確保 78 張任抽都不會爆掉
                let cardMeaning = meaningsPool[card.name];
                if (!cardMeaning) {
                    cardMeaning = generateFallbackMeaning(card.name);
                }
                
                const typeMeaning = cardMeaning[selectedType] || cardMeaning["general"];
                const explanation = card.isReversed ? typeMeaning.reversed : typeMeaning.upright;
                const oriText = card.isReversed ? "逆位 // REVERSED" : "正位 // UPRIGHT";
                
                const cardBox = document.createElement('div'); cardBox.className = 'result-card-box';
                cardBox.innerHTML = `
                    <h3>${positions[index]}</h3>
                    <div class="result-card-static">
                        <img src="cards/${card.img}" class="${card.isReversed ? 'reversed' : ''}">
                    </div>
                    <div class="result-info">
                        <span class="card-title-en">${card.name}</span>
                        <span class="card-title-cn">${cardMeaning.nameCN}</span>
                        <div class="orientation ${card.isReversed ? 'reversed-text' : 'upright-text'}">${oriText}</div>
                        <p class="card-desc-text">${explanation}</p>
                    </div>`;
                resultDeckDiv.appendChild(cardBox);
            });
            generateComprehensiveSummary(meaningsPool); 
            switchView('result-view');
        }

        function generateFallbackMeaning(name) {
            // 針對小牌快速解析
            let suite = "未知"; let nameCN = name;
            if(name.includes("Wands")) { suite = "權杖 (行動/火元素)"; }
            if(name.includes("Cups")) { suite = "聖杯 (情感/水元素)"; }
            if(name.includes("Swords")) { suite = "寶劍 (傷害與思考/風元素)"; }
            if(name.includes("Pentacles")) { suite = "錢幣 (物質與穩定/土元素)"; }
            
            return {
                nameCN: name.replace("Wands", "權杖").replace("Cups", "聖杯").replace("Swords", "寶劍").replace("Pentacles", "錢幣").replace("Ace", "單子一").replace("Page", "侍從").replace("Knight", "騎士").replace("Queen", "皇后").replace("King", "國王"),
                general: { 
                    upright: `代表該元素能量順暢。${suite}目前在生活中佔據主導地位，推動局勢前進。`, 
                    reversed: `代表該元素能量受阻、過度或不足。${suite}的特質發生偏移，需要停下修正。` 
                },
                love: { 
                    upright: `感情中展現出${suite}的正向回饋，互動自然且符合預期脈絡。`, 
                    reversed: `感情中因為${suite}的拉扯感到焦慮，存在一定程度的不合拍與隱藏矛盾。` 
                },
                work: { 
                    upright: `工作學業執行力良好，發揮出${suite}的優勢，專案按部就班前進。`, 
                    reversed: `事業發展面臨${suite}代碼瓶頸，執行進度延宕，要注意資源配置不均。` 
                }
            };
        }

        function generateComprehensiveSummary(meaningsPool) {
            const pCard = selectedHand[0]; const prCard = selectedHand[1]; const fCard = selectedHand[2];
            const pMeaning = meaningsPool[pCard.name] || generateFallbackMeaning(pCard.name);
            const prMeaning = meaningsPool[prCard.name] || generateFallbackMeaning(prCard.name);
            const fMeaning = meaningsPool[fCard.name] || generateFallbackMeaning(fCard.name);
            
            const pName = pMeaning.nameCN + (pCard.isReversed ? "逆位" : "正位");
            const prName = prMeaning.nameCN + (prCard.isReversed ? "逆位" : "正位");
            const fName = fMeaning.nameCN + (fCard.isReversed ? "逆位" : "正位");
            const totalUprights = selectedHand.filter(c => !c.isReversed).length; 
            
            let introText = "", coreAnalysis = "", adviceText = "";
            if (totalUprights === 3) { 
                introText = `本次 78 張全要素矩陣呈現高度線性的動態流動。從過去的【${pName}】到當前的【${prName}】，你的潛意識意識流極度通暢。`; 
                coreAnalysis = `這暗示著此時外界環境的噪音並未干擾你的底層判斷。隨著未來節點的【${fName}】正位落座，事件將會如同預期代碼一樣，推向效率最高、結果最飽滿的終點。`; 
                adviceText = "請完全信任當下的執行步調，不要瞻前顧後。將注意力集中在目標上，果斷推進核心決策即可。"; 
            } else if (totalUprights === 2) { 
                introText = `矩陣分析顯示，大局正在往明朗與可控的方向收斂。雖然在特定的時間刻度上，因個別逆位造成了短暫的阻滯或能量折損，但主流依然被強大動能主導。`; 
                coreAnalysis = `過去與現在的【${pName}】及【${prName}】相互交織，顯示雖有些許盲點或不可控因素干擾，但未來的【${fName}】透露出破局的曙光。`; 
                adviceText = "現階段不需要大刀闊斧的改變，只需要對執行層面進行『精密的局部微調』。保持耐心，阻礙自然會消退。"; 
            } else if (totalUprights === 1) { 
                introText = `當前矩陣出現了大面積的逆位拉扯，這是來自潛意識防禦機制的嚴肅警訊。意味著局勢中隱藏著大量的資訊不對稱、能量受阻與內在焦慮。`; 
                coreAnalysis = `雖然有少數節點試圖撐起局勢，但在時間軸的劇烈張力下，逆位的壓抑感蓋過了前進的可能。當前的盲點或環境壓迫感正處於波峰期。`; 
                adviceText = "時機尚未成熟，切忌盲目求成。建議先收回外在的精力，全面進行內部整頓，找出真正的瓶頸。"; 
            } else { 
                introText = `三數據節點全數失衡（【${pName}】 ➔ 【${prName}】 ➔ 【${fName}】）。這代表著當前系統正經歷全盤的架構重組與能量低潮。`; 
                coreAnalysis = `這也強烈暗示著，你過去所依賴的思維定勢、習慣模式或是某種強求的執念，已經完全不適用於目前的環境了。`; 
                adviceText = "這是最需要徹底放手與臣服的時刻。請立刻停止所有高風險的擴張與試探，靜待矩陣能量完成自我修正。"; 
            }
            document.getElementById('summary-section').innerHTML = `<h2>🔮 [ 綜合點評 ]</h2><p>${introText}</p><p>${coreAnalysis}</p><p>${adviceText}</p>`;
        }

        function generateCardAndRedirect() {

            if(typeof html2canvas === 'undefined') { window.location.href = "https://s.shopee.tw/40eMd6bUyk"; return; }
