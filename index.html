<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔮 聖三角占卜測試版</title>
    <style>
        body { 
            font-family: monospace;
            background-color: #050505;
            color: #d1d1d1; 
            text-align: center; 
            padding: 20px;
            margin: 0;
        }
        .debug-panel {
            background: #1a0505;
            border: 1px solid #ef4444;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            text-align: left;
            font-size: 12px;
        }
        .panel-section { 
            margin: 20px auto; max-width: 500px; background: #0a0a0a; padding: 30px 20px; 
            border-radius: 12px; border: 1px solid #1f1f1f;
        }
        button { 
            background-color: #dc2626; color: #fff; border: none; padding: 15px 40px; 
            font-size: 14px; font-weight: bold; border-radius: 9999px; cursor: pointer; display: inline-block;
        }
        button:active { background-color: #b91c1c; }
        .view-node { display: none; }
        .view-node.active-node { display: block; }
    </style>
</head>
<body>

    <div class="debug-panel">
        <strong>[ SYSTEM_DEBUG_LOG ]</strong>
        <div id="debug-text" style="color: #10b981; margin-top: 5px;">系統已準備就緒，等待點擊...</div>
    </div>

    <div id="wrapper">
        <div id="home-view" class="view-node active-node panel-section">
            <p style="margin-bottom: 30px; line-height: 1.6;">這是完全移除外部套件與龐大文本的純淨核心版本。請點擊下方按鈕測試換頁。</p>
            
            <button onclick="logAndSwitch()">進入占卜矩陣 // ENTER</button>
        </div>

        <div id="divination-view" class="view-node panel-section">
            <h2 style="color: #10b981;">✔ 成功進入占卜矩陣！</h2>
            <p>這代表你的瀏覽器環境可以正常執行核心 JavaScript 換頁機制。</p>
            <button style="background-color: #3f3f46;" onclick="switchView('home-view')">返回測試首頁</button>
        </div>
    </div>

    <script>
        // 全域錯誤捕捉器：只要程式碼有任何地方死掉，直接寫在畫面上給你看
        window.onerror = function(message, source, lineno, colno, error) {
            const debugDiv = document.getElementById('debug-text');
            if (debugDiv) {
                debugDiv.style.color = '#ef4444';
                debugDiv.innerText = `🚨 偵測到報錯: ${message} (第 ${lineno} 行)`;
            }
            return false;
        };

        // 換頁功能
        function switchView(viewId) {
            try {
                const nodes = document.querySelectorAll('.view-node');
                for (let i = 0; i < nodes.length; i++) {
                    nodes[i].classList.remove('active-node');
                }
                const target = document.getElementById(viewId);
                if (target) {
                    target.classList.add('active-node');
                    document.getElementById('debug-text').innerText = `📊 成功切換至視圖: ${viewId}`;
                } else {
                    document.getElementById('debug-text').innerText = `🚨 找不到對應的網頁區塊: ${viewId}`;
                }
            } catch (err) {
                document.getElementById('debug-text').innerText = `🚨 切換視圖時崩潰: ${err.message}`;
            }
        }

        // 按鈕專用中繼功能
        function logAndSwitch() {
            document.getElementById('debug-text').innerText = "⚡ 偵測到按鈕點擊，正在嘗試切換...";
            setTimeout(function() {
                switchView('divination-view');
            }, 50);
        }
    </script>
</body>
</html>
