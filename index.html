        // ==================== 音效引擎 ====================
        const AudioEngine = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type, step = 0) {
            if (AudioEngine.state === 'suspended') { AudioEngine.resume(); }
            const now = AudioEngine.currentTime;
            if (type === 'click') {
                const osc = AudioEngine.createOscillator(); const gain = AudioEngine.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
                gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.connect(gain); gain.connect(AudioEngine.destination); osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'shuffle_tick') {
                const osc = AudioEngine.createOscillator(); const filter = AudioEngine.createBiquadFilter(); const gain = AudioEngine.createGain();
                osc.type = 'sine'; let freq = 1600 + (step * 250); osc.frequency.setValueAtTime(freq, now); osc.frequency.exponentialRampToValueAtTime(freq - 600, now + 0.05);
                filter.type = 'bandpass'; filter.frequency.setValueAtTime(freq, now); gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.connect(filter); filter.connect(gain); gain.connect(AudioEngine.destination); osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'flip') {
                const oscBase = AudioEngine.createOscillator(); const oscTop = AudioEngine.createOscillator(); const gain = AudioEngine.createGain();
                let baseFreq = 329.63; if (step === 1) baseFreq = 392.00; if (step === 2) baseFreq = 523.25;
                oscBase.type = 'triangle'; oscBase.frequency.setValueAtTime(baseFreq, now); oscBase.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, now + 0.3);
                oscTop.type = 'sine'; oscTop.frequency.setValueAtTime(baseFreq * 2, now); oscTop.frequency.exponentialRampToValueAtTime(baseFreq * 4, now + 0.25);
                gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                oscBase.connect(gain); oscTop.connect(gain); gain.connect(AudioEngine.destination); oscBase.start(now); oscTop.start(now); oscBase.stop(now + 0.35); oscTop.stop(now + 0.35);
            } else if (type === 'error') {
                const osc = AudioEngine.createOscillator(); const gain = AudioEngine.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(140, now); gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain); gain.connect(AudioEngine.destination); osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'success') {
                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((freq, index) => {
                    const osc = AudioEngine.createOscillator(); const gain = AudioEngine.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now + index * 0.05);
                    gain.gain.setValueAtTime(0.06, now + index * 0.05); gain.gain.exponentialRampToValueAtTime(0.002, now + index * 0.05 + 0.15);
                    osc.connect(gain); gain.connect(AudioEngine.destination); osc.start(now + index * 0.05); osc.stop(now + index * 0.05 + 0.15);
                });
            } else if (type === 'capture') {
                const osc = AudioEngine.createOscillator(); const gain = AudioEngine.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(1800, now); gain.gain.setValueAtTime(0.06, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain); gain.connect(AudioEngine.destination); osc.start(now); osc.stop(now + 0.08);
            }
        }

        let currentHandData = []; let currentFlipIndex = 0; let selectedType = 'general';

        function switchView(viewId) { document.querySelectorAll('.view-node').forEach(node => node.classList.remove('active-node')); document.getElementById(viewId).classList.add('active-node'); }
        function resetDivinationEngine() { document.getElementById('question').value = ''; document.getElementById('user-question-display').innerText = ''; document.getElementById('flow-hint').innerText = ''; document.getElementById('deck').innerHTML = ''; }
        function resetToHome() { resetDivinationEngine(); switchView('home-view'); }

        function startTarotSession() {
            const questionInput = document.getElementById('question').value.trim();
            selectedType = document.getElementById('question-type').value;
            if (questionInput === "") { playSound('error'); alert("🔮 占卜需要誠心，請先輸入你想問的問題喔！"); return; }
            playSound('click');
            const typeNames = { 'general': '綜合運勢', 'love': '感情發展', 'work': '工作學業' };
            document.getElementById('user-question-display').innerText = `[ MATRIX_TARGET // ${typeNames[selectedType]} : ${questionInput} ]`;
            document.getElementById('flow-hint').innerText = "DECRYPTING_SUB_NODES...";
            initStaticDeck();
            currentFlipIndex = 0;
            const shuffled = [...tarotData.cards].sort(() => 0.5 - Math.random());
            currentHandData = shuffled.slice(0, 3).map(card => { return { ...card, isReversed: Math.random() < 0.5 }; });
            runDigitalShuffle(); 
        }

        function initStaticDeck() {
            const deckDiv = document.getElementById('deck'); deckDiv.innerHTML = '';
            const positions = ["過去 // PAST", "現在 // PRESENT", "未來 // FUTURE"];
            for (let i = 0; i < 3; i++) {
                const cardBox = document.createElement('div'); cardBox.className = 'card-box';
                cardBox.innerHTML = `<h3>${positions[i]}</h3><div class="card" id="card-${i}" onclick="handleCardFlip(${i})"><div class="card-inner"><div class="card-back">⚝</div><div class="card-front" id="front-slot-${i}"></div></div></div>`;
                deckDiv.appendChild(cardBox);
            }
        }

        function runDigitalShuffle() {
            let step = 0;
            const shuffleTimer = setInterval(() => {
                if (step < 3) {
                    const card = document.getElementById(`card-${step}`);
                    if (card) { card.classList.add('scanning'); playSound('shuffle_tick', step); }
                    step++;
                } else {
                    clearInterval(shuffleTimer);
                    setTimeout(() => {
                        currentHandData.forEach((card, i) => {
                            const cardEl = document.getElementById(`card-${i}`);
                            if (cardEl) cardEl.classList.remove('scanning');
                            const slot = document.getElementById('front-slot-' + i);
                            if (slot) slot.innerHTML = `<img src="cards/${card.img}" class="${card.isReversed ? 'reversed' : ''}" alt="${card.name}">`;
                        });
                        unlockNextCard();
                    }, 300);
                }
            }, 250); 
        }

        function unlockNextCard() {
            if (currentFlipIndex < 3) {
                const targetCard = document.getElementById(`card-${currentFlipIndex}`);
                if (targetCard) targetCard.classList.add('playable');
                const posName = currentFlipIndex === 0 ? "過去" : (currentFlipIndex === 1 ? "現在" : "未來");
                document.getElementById('flow-hint').innerText = `👉 請點擊翻開【${posName}】數據節點`;
            } else {
                document.getElementById('flow-hint').innerText = "SYSTEM_SUCCESS // 矩陣分析完成...";
                playSound('success'); setTimeout(() => { compileAndShowResultView(); }, 1000);
            }
        }

        function handleCardFlip(index) {
            const cardEl = document.getElementById(`card-${index}`);
            if (cardEl && cardEl.classList.contains('playable') && !cardEl.classList.contains('flipped')) {
                playSound('flip', index); cardEl.classList.add('flipped'); cardEl.classList.remove('playable');
                currentFlipIndex++; setTimeout(() => { unlockNextCard(); }, 600);
            }
        }

        function compileAndShowResultView() {
            const questionInput = document.getElementById('question').value.trim();
            const typeNames = { 'general': '綜合運勢', 'love': '感情發展', 'work': '工作學業' };
            document.getElementById('result-question-title').innerText = `[ 矩陣解構目標 // ${typeNames[selectedType]} : ${questionInput} ]`;
            const resultDeckDiv = document.getElementById('result-deck-display'); resultDeckDiv.innerHTML = '';
            const positions = ["過去 // PAST", "現在 // PRESENT", "未來 // FUTURE"];
            
            currentHandData.forEach((card, index) => {
                const cardMeaning = tarotMeanings[card.name] || tarotMeanings["default"];
                const typeMeaning = cardMeaning[selectedType] || cardMeaning["general"];
                const explanation = card.isReversed ? typeMeaning.reversed : typeMeaning.upright;
                const oriText = card.isReversed ? "逆位 // REVERSED" : "正位 // UPRIGHT";
                
                const cardBox = document.createElement('div'); cardBox.className = 'card-box';
                cardBox.innerHTML = `<h3>${positions[index]}</h3><div class="result-card-static"><img src="cards/${card.img}" class="${card.isReversed ? 'reversed' : ''}"></div><div class="result-info"><span class="card-title-en">${card.name}</span><span class="card-title-cn">${cardMeaning.nameCN}</span><div class="orientation ${card.isReversed ? 'reversed-text' : 'upright-text'}">${oriText}</div><p style="margin:5px 0; font-size:12px; text-align:justify;">${explanation}</p></div>`;
                resultDeckDiv.appendChild(cardBox);
            });
            generateComprehensiveSummary(); switchView('result-view');
        }
