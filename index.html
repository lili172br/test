<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 聖三角神祕學塔羅占卜</title>
    <style>
        /* 基礎神祕學風格視覺 */
        body { 
            font-family: "Georgia", "Times New Roman", "華康明體", "微軟正黑體", serif; 
            background: radial-gradient(circle at center, #1b1f38 0%, #0d0f1d 100%);
            color: #e0e0e0; 
            text-align: center; 
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        h1 { color: #f39c12; letter-spacing: 2px; text-shadow: 0 0 10px rgba(243, 156, 18, 0.5); }
        
        /* 問題輸入區與分類選單 */
        .question-section { 
            margin: 20px auto; 
            max-width: 500px; 
            background: rgba(44, 62, 80, 0.4); 
            padding: 25px; 
            border-radius: 12px; 
            border: 1px solid rgba(243, 156, 18, 0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); 
        }
        .question-section label { display: block; margin: 12px 0 6px 0; font-size: 16px; color: #f1c40f; font-weight: bold; }
        .question-section input, .question-section select { 
            width: 85%; padding: 12px; font-size: 16px; border: 2px solid #f39c12; border-radius: 6px; 
            background: #0d0f1d; color: #fff; text-align: center; outline: none; transition: 0.3s; box-sizing: border-box;
        }
        .question-section input:focus, .question-section select:focus { border-color: #e67e22; box-shadow: 0 0 12px rgba(230, 126, 34, 0.6); }
        .question-section select { text-align-last: center; cursor: pointer; }
        
        /* 狀態與問題提示 */
        #user-question-display { font-size: 18px; color: #f1c40f; margin: 25px 0 10px 0; font-weight: bold; min-height: 27px; }
        #flow-hint { color: #95a5a6; font-style: italic; font-size: 14px; margin-bottom: 20px; }

        /* 牌陣容器 */
        .container { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        
        /* 單張卡牌外殼 */
        .card-box { width: 160px; text-align: center; }
        .card-box h3 { color: #f39c12; font-size: 16px; margin-bottom: 12px; }
        
        /* 卡牌本體與 3D 翻牌效果 */
        .card { 
            width: 160px; height: 274px; perspective: 1000px; margin-bottom: 15px; 
            pointer-events: none; opacity: 0.3; transition: transform 0.3s, opacity 0.5s;
        }
        .card.playable { pointer-events: auto; opacity: 1; cursor: pointer; }
        .card.playable:hover { transform: translateY(-8px); }
        
        .card-inner { width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s; position: relative; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.6); }
        .card-back { background: linear-gradient(135deg, #1a252f, #000); border: 2px solid #f39c12; display: flex; align-items: center; justify-content: center; color: #f39c12; font-size: 28px; }
        .card-front { transform: rotateY(180deg); background-color: #000; border: 2px solid rgba(253, 203, 110, 0.5); border-radius: 10px; }
        .card-front img { width: 100%; height: 100%; border-radius: 8px; object-fit: cover; }
        
        .reversed { transform: rotate(180deg); }
        
        /* 解釋文字區 */
        .result-info { font-size: 14px; line-height: 1.6; min-height: 120px; padding: 5px; box-sizing: border-box; opacity: 0; visibility: hidden; transition: opacity 0.6s ease; }
        .card.flipped + .result-info { opacity: 1; visibility: visible; }
        
        .orientation { font-weight: bold; margin: 5px 0; font-size: 13px; }
        .upright-text { color: #2ecc71; }
        .reversed-text { color: #e74c3c; }
        
        /* 新增：大師綜合總結區塊樣式（古典羊皮紙神祕感） */
        .summary-box {
            max-width: 600px;
            margin: 40px auto 20px auto;
            background: linear-gradient(rgba(243, 156, 18, 0.05), rgba(0, 0, 0, 0.4)), #1e1b29;
            border: 2px dashed #f39c12;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.15);
            text-align: left;
            line-height: 1.8;
            display: none; /* 預設隱藏，全部翻完才顯示 */
        }
        .summary-box h2 { color: #f1c40f; text-align: center; margin-top: 0; font-size: 20px; letter-spacing: 1px; }
        .summary-box p { margin: 10px 0 0 0; font-size: 15px; color: #f5f5f5; text-indent: 2em; }

        /* 功能按鈕 */
        #action-zone { margin-top: 30px; display: none; }
        button { background-color: #f39c12; color: #000; border: none; padding: 12px 35px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        button:hover { background-color: #e67e22; }
        .btn-secondary { background-color: #34495e; color: #fff; margin-left: 10px; }
        .btn-secondary:hover { background-color: #2c3e50; }

        /* 洗牌動畫 */
        @keyframes shuffleLeft { 0% { transform: translateX(0); } 50% { transform: translateX(-60px) rotate(-10deg); } 100% { transform: translateX(0); } }
        @keyframes shuffleRight { 0% { transform: translateX(0); } 50% { transform: translateX(60px) rotate(10deg); } 100% { transform: translateX(0); } }
        .shuffling-left { animation: shuffleLeft 0.5s ease-in-out 2; }
        .shuffling-right { animation: shuffleRight 0.5s ease-in-out 2; }
    </style>
</head>
<body>

    <h1>🔮 線上塔羅神祕學占卜</h1>
    
    <div class="question-section">
        <label for="question">請在心中默想你的問題，並記錄在下方：</label>
        <input type="text" id="question" placeholder="例如：我接下來的感情發展合適嗎？">
        
        <label for="question-type">請選擇占卜的類別：</label>
        <select id="question-type">
            <option value="general">綜合運勢分析</option>
            <option value="love">感情桃花發展</option>
            <option value="work">工作、學業與事業</option>
        </select>
        <br>
        <button id="draw-btn" onclick="startTarotSession()">開始洗牌占卜</button>
    </div>

    <div id="user-question-display"></div>
    <div id="flow-hint"></div>

    <!-- 牌陣顯示區 -->
    <div id="deck" class="container"></div>

    <!-- 新增：大師綜合解析總結區 -->
    <div id="summary-section" class="summary-box"></div>

    <div id="action-zone">
        <button class="btn-secondary" onclick="copyReport()">📋 複製完整占卜報告</button>
    </div>

    <script>
        // 1. 卡牌原始資料
        const tarotData = {
          "cards": [
            { "name": "The Fool", "img": "m00.jpg" },
            { "name": "The Magician", "img": "m01.jpg" },
            { "name": "The High Priestess", "img": "m02.jpg" },
            { "name": "The Empress", "img": "m03.jpg" },
            { "name": "The Emperor", "img": "m04.jpg" }
          ]
        };

        // 2. 精細化分類牌意資料庫
        const tarotMeanings = {
            "The Fool": {
                nameCN: "愚者",
                general: { upright: "新的開始、自由、冒險。代表一個不問過去、充滿勇氣的全新旅程。", reversed: "魯莽、輕率、不負責任。警惕缺乏計劃的盲目行動與逃避環境。" },
                love: { upright: "一段充滿新鮮感、無拘無束的新戀情即將展開，享受當下，但缺乏長遠規劃。", reversed: "感情中過度盲目，可能存在不願意給予承諾的恐懼，或是關係流於輕浮。" },
                work: { upright: "適合挑戰全新的領域、創業或跳槽。拋開傳統束縛，你的直覺會指引你。", reversed: "工作上缺乏規劃導致混難，盲目換工作可能引發不必要的職業風險。" }
            },
            "The Magician": {
                nameCN: "魔術師",
                general: { upright: "創造力、行動力、潛力發揮。萬事俱備，眼前有著無限資源供你靈活運用。", reversed: "操縱、欺騙、能力未發揮。計畫可能不夠踏實，需注意身邊小人。" },
                love: { upright: "關係中溝通流暢，充滿趣味。單身者有望憑藉自身魅力吸引優秀對象。", reversed: "注意感情中的甜言蜜語背後是否藏有隱瞞、欺騙，或是流於表面缺乏真心。" },
                work: { upright: "展現強大工作能力的時期，能完美掌握新專案、新技術，出師大捷。", reversed: "空有才華卻缺乏執行力，或是注意職場上被主管、同事話術欺騙或操縱。" }
            },
            "The High Priestess": {
                nameCN: "女祭司",
                general: { upright: "直覺、潛意識、智慧、冷靜。現在是向內探索、傾聽心靈聲音的時刻。", reversed: "膚淺、過度理智、壓抑情感。你可能忽略了隱藏在表象下的神祕真相。" },
                love: { upright: "感情上較為被動、精神交流大於物質。單身者目前享受獨處，對感情抱持審慎觀察。", reversed: "情感壓抑過度導致隔閡，或是過度敏感、猜忌，無法坦率面對自己的真感情。" },
                work: { upright: "適合從事研究、企劃、分析等靜態工作，靠著精準的直覺與理性分析能做出正確抉擇。", reversed: "面對職場決策時過度猶豫不決，或是資訊不透明導致做出了錯誤的研判。" }
            },
            "The Empress": {
                nameCN: "皇后",
                general: { upright: "豐收、繁榮、孕育、母愛。代表物質生活與精神生活的富足，正處於收穫期。", reversed: "缺乏安全感、過度控制、創造力受阻。注意不要給予他人過度的情感勒索。" },
                love: { upright: "感情生活充滿甜蜜與熱情，彼此包容，這是一段非常滋養、走向家庭的吉兆。", reversed: "在關係中過度溺愛、佔有慾過強，或因物質問題導致感情產生摩擦。" },
                work: { upright: "職場發展順遂，努力將迎來實質的回報或業績大紅利，團隊氛圍和諧。", reversed: "工作流於怠惰、安逸，缺乏積極度；亦可能因為過度鋪張浪費導致預算出問題。" }
            },
            "The Emperor": {
                nameCN: "皇帝",
                general: { upright: "權力、穩定、控制、秩序。擁有堅強的意志力、領導力與清晰的掌控架構。", reversed: "暴政、軟弱、控制狂。容易流於教條僵化，或對局勢逐漸失去掌控力。" },
                love: { upright: "感情關係穩定、具有安全感，對方可能是一位較有主導權、願意承擔責任的人。", reversed: "感情中一方過於專斷、固執、難以溝通，缺乏浪漫，互動充滿壓迫感。" },
                work: { upright: "有望晉升主管職、建立制度，在專案中扮演核心決策者，穩定推進權力基礎。", reversed: "職場遇到僵化的體制、遭遇暴君型主管壓榨，或自身領導不當導致計畫停滯。" }
            },
            "default": {
                nameCN: "未知卡牌",
                general: { upright: "事情正朝著積極的方向發展，保持信心與熱情。", reversed: "當前可能面臨短暫的阻礙，建議調整步伐、審慎評估。" },
                love: { upright: "感情方面請順應內心，真誠互動將會迎來好結果。", reversed: "情感可能出現短暫停滯，多溝通才能化解潛在的心結。" },
                work: { upright: "工作學業推進順利，持之以恆必能取得預期中的成果。", reversed: "發展受制於環境，建議多看多聽，盲目推展並非明智之舉。" }
            }
        };

        let currentHandData = []; 
        let currentFlipIndex = 0; 
        let selectedType = 'general';
        let generatedSummary = ""; // 儲存產生的總結文字

        function startTarotSession() {
            const questionInput = document.getElementById('question').value.trim();
            selectedType = document.getElementById('question-type').value;

            if (questionInput === "") {
                alert("🔮 占卜需要誠心，請先輸入你想問的問題喔！");
                return;
            }

            const typeNames = { 'general': '綜合運勢', 'love': '感情發展', 'work': '工作學業' };
            document.getElementById('user-question-display').innerText = `［ 占卜主題（${typeNames[selectedType]}）：${questionInput} ］`;
            document.getElementById('flow-hint').innerText = "🔮 正在為您洗牌中，請靜心等待...";
            document.getElementById('deck').innerHTML = '';
            
            // 重置總結區與按鈕區
            const summaryDiv = document.getElementById('summary-section');
            summaryDiv.style.display = 'none';
            summaryDiv.innerHTML = '';
            document.getElementById('action-zone').style.display = 'none';
            currentFlipIndex = 0;

            // 洗牌與抽取
            const shuffled = [...tarotData.cards].sort(() => 0.5 - Math.random());
            currentHandData = shuffled.slice(0, 3).map(card => {
                return { ...card, isReversed: Math.random() < 0.5 };
            });
            
            setTimeout(() => { dealCards(); }, 1200); 
        }

        function dealCards() {
            const deckDiv = document.getElementById('deck');
            const positions = ["過去 (Past)", "現在 (Present)", "未來 (Future)"];

            currentHandData.forEach((card, index) => {
                const cardMeaning = tarotMeanings[card.name] || tarotMeanings["default"];
                const typeMeaning = cardMeaning[selectedType] || cardMeaning["general"];
                
                const cardNameShow = cardMeaning.nameCN !== "未知卡牌" ? `${card.name} (${cardMeaning.nameCN})` : card.name;
                const explanation = card.isReversed ? typeMeaning.reversed : typeMeaning.upright;
                const orientationText = card.isReversed ? "逆位 (Reversed)" : "正位 (Upright)";
                const orientationClass = card.isReversed ? "reversed-text" : "upright-text";

                const cardBox = document.createElement('div');
                cardBox.className = 'card-box';
                const animClass = index === 0 ? 'shuffling-left' : (index === 2 ? 'shuffling-right' : '');

                cardBox.innerHTML = `
                    <h3>${positions[index]}</h3>
                    <div class="card ${animClass}" id="card-${index}" onclick="handleCardFlip(${index})">
                        <div class="card-inner">
                            <div class="card-back">★</div>
                            <div class="card-front">
                                <img src="cards/${card.img}" class="${card.isReversed ? 'reversed' : ''}" alt="${card.name}">
                            </div>
                        </div>
                    </div>
                    <div class="result-info">
                        <h4>${cardNameShow}</h4>
                        <div class="orientation ${orientationClass}">${orientationText}</div>
                        <p>${explanation}</p>
                    </div>
                `;
                deckDiv.appendChild(cardBox);
            });

            setTimeout(() => {
                for(let i=0; i<3; i++) {
                    const el = document.getElementById(`card-${i}`);
                    if(el) el.classList.remove('shuffling-left', 'shuffling-right');
                }
                unlockNextCard();
            }, 1000);
        }

        function unlockNextCard() {
            if (currentFlipIndex < 3) {
                const targetCard = document.getElementById(`card-${currentFlipIndex}`);
                if (targetCard) targetCard.classList.add('playable');
                const posName = currentFlipIndex === 0 ? "過去" : (currentFlipIndex === 1 ? "現在" : "未來");
                document.getElementById('flow-hint').innerText = `👉 請點擊翻開代表【${posName}】的卡牌`;
            } else {
                document.getElementById('flow-hint').innerText = "✨ 占卜已完成。大師開示生成中...";
                generateComprehensiveSummary(); // 💡 觸發智慧總結
            }
        }

        function handleCardFlip(index) {
            const cardEl = document.getElementById(`card-${index}`);
            if (cardEl && cardEl.classList.contains('playable') && !cardEl.classList.contains('flipped')) {
                cardEl.classList.add('flipped');
                cardEl.classList.remove('playable');
                currentFlipIndex++;
                setTimeout(() => { unlockNextCard(); }, 800);
            }
        }

        // 3. 💡 新增：智慧總結演算法邏輯
        function generateComprehensiveSummary() {
            // 計算三張牌中「正位」的數量
            const uprightCount = currentHandData.filter(c => !c.isReversed).count; 
            const uprights = currentHandData.filter(c => !c.isReversed);
            const totalUprights = uprights.length; // 計算真正的數量
            
            // 抓取未來的牌況
            const futureCard = currentHandData[2];
            const isFutureUpright = !futureCard.isReversed;

            let typeWord = selectedType === 'love' ? '感情桃花' : (selectedType === 'work' ? '工作事業' : '整體運勢');
            let summaryText = "";

            // 根據正位數量與未來時態建立多分支邏輯判斷
            if (totalUprights === 3) {
                summaryText = `這是一次非常幸運且和諧的「全正位」聖三角牌陣！從過去的奠基到現在的執行，你都走在完全正確的軌道上。未來發展（${tarotMeanings[futureCard.name]?.nameCN || '新起點'}）更是充滿光明。目前的阻礙極小，請順應你當前的熱情與步調，大膽地向前推進，事情將會迎來圓滿且富足的結果。`;
            } else if (totalUprights === 2) {
                if (isFutureUpright) {
                    summaryText = `當前的牌陣呈現「倒吃甘蔗」的良性流向。儘管在過去或現在的階段中，你可能經歷了一些不順遂、迷茫或計畫受阻（逆位卡牌所對應的時態），但別擔心！因為代表最終結果的未來牌呈現極佳的正位。這意味著眼前的混亂只是短暫的考驗，只要修正當前的步伐，最終的局勢依然會朝著對你非常有利的方向明朗化。`;
                } else {
                    summaryText = `目前的局勢呈現「前順後阻」的現象。你的起步與目前的狀態其實都算穩定或具備優勢（前兩張多為正位），但代表未來的最後一哩路卻出現了干擾或逆位。這是一個重要的警訊！大師建議你，雖然現在看起來沒事，但必須居安思危，提前為未來可能出現的溝通不良、資源匱乏或魯莽決策做好防範準備。`;
                }
            } else if (totalUprights === 1) {
                if (isFutureUpright) {
                    summaryText = `這是一個典型的「逆境重生」牌陣。你在過去與現在承受了極大的壓力、阻礙或混亂（前兩張皆為逆位），可能讓你感到心力交瘁。不過，破曉的曙光就在前方！未來的卡牌以正位之姿降臨，暗示著你即將觸底反彈。只要熬過眼前的瓶頸，並從過去的失敗中吸取教訓，未來將會迎來強烈的新轉機。`;
                } else {
                    summaryText = `目前局勢正處於較為艱辛的「調整期」。整個聖三角中逆位偏多，且未來亦受到逆位能量的干擾。這代表你所詢問的這個問題，目前的時機可能尚未成熟，或者前進的方向存在著根本性的盲點。大師強烈建議你：現在不宜盲目加碼或做出重大決定，應先停下腳步、沈澱心情，進行徹底的內部整頓或尋求專業外界協助，方能化解未來的危機。`;
                }
            } else {
                // 3張皆為逆位
                summaryText = `牌面出現了極為罕見的「全逆位」極端星象。這意味著不論是過去的起因、現在的現況還是未來的發展，都充斥著強烈的混亂、停滯或能量受阻。這並不是世界末日，而是宇宙在對你發出強烈的「暫停訊號」。代表你目前想前進的方法、或是問事的心態可能完全偏離了軌道。請立刻停止橫衝直撞，大破大立地全面重新審視這個問題，這才是將逆境轉化為轉機的唯一解藥。`;
            }

            generatedSummary = `【大師綜合點評】\n針對您詢問的「${typeWord}」問題，縱觀整個聖三角的時態流向：${summaryText}`;

            // 將結果渲染至畫面上
            const summaryDiv = document.getElementById('summary-section');
            summaryDiv.innerHTML = `<h2>🔮 大師綜合星象結算</h2><p>${summaryText}</p>`;
            
            // 漸顯效果
            setTimeout(() => {
                summaryDiv.style.display = 'block';
                document.getElementById('action-zone').style.display = 'block';
            }, 500);
        }

        // 4. 修改後的複製占卜報告（連同大師總結一起複製）
        function copyReport() {
            const question = document.getElementById('question').value.trim();
            const typeNames = { 'general': '綜合運勢', 'love': '感情發展', 'work': '工作學業' };
            const positions = ["過去", "現在", "未來"];
            
            let reportText = `🔮 【線上塔羅占卜報告】\n`;
            reportText += `💬 占卜問題：${question} (${typeNames[selectedType]})\n`;
            reportText += `───────────────────\n`;

            currentHandData.forEach((card, index) => {
                const cardMeaning = tarotMeanings[card.name] || tarotMeanings["default"];
                const typeMeaning = cardMeaning[selectedType] || cardMeaning["general"];
                
                const nameText = cardMeaning.nameCN !== "未知卡牌" ? `${card.name} (${cardMeaning.nameCN})` : card.name;
                const oriText = card.isReversed ? "逆位" : "正位";
                const expText = card.isReversed ? typeMeaning.reversed : typeMeaning.upright;

                reportText += `▶ 【${positions[index]}】 ${nameText} - ${oriText}\n`;
                reportText += `💡 專屬解析：${expText}\n\n`;
            });
            
            reportText += `───────────────────\n`;
            reportText += `📝 ${generatedSummary}\n`;
            reportText += `───────────────────\n*報告產生時間：${new Date().toLocaleString()}*`;

            navigator.clipboard.writeText(reportText)
                .then(() => alert("✨ 包含「大師綜合點評」的完整報告已成功複製！"))
                .catch(err => alert("複製失敗，請手動複製網頁文字。"));
        }
    </script>
