        /* 核心定位區塊 */
        .container { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
            justify-content: center; 
            margin: 20px auto; 
            min-height: 340px; 
            max-width: 600px; 
            width: 100%; 
            box-sizing: border-box; 
            position: relative; 
        }
        .card-box { width: 100%; text-align: center; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .card-box h3 { color: #71717a; font-size: 10px; margin-bottom: 12px; tracking: 0.1em; text-transform: uppercase; white-space: nowrap; }
        
        /* 基礎卡牌樣式 */
        .card { 
            width: 100%; max-width: 150px; height: 257px; perspective: 1000px; margin: 0 auto 15px auto; 
            pointer-events: none; opacity: 1; box-sizing: border-box;
            position: relative;
            z-index: 5;
            /* 發牌與歸位時使用流暢的立體貝氏曲線 */
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s;
        }

        /* 洗牌期間關閉 transition，完全交給 JS 進行高頻物理渲染 */
        .card.shuffling-physics {
            transition: none !important;
            box-shadow: 0 14px 35px rgba(0,0,0,0.85);
        }

        /* 正常可點擊狀態 */
        .card.playable { 
            pointer-events: auto; opacity: 1; cursor: pointer;
        }
        .card.playable:hover { transform: translateY(-8px) scale(1.02); filter: drop-shadow(0 0 15px rgba(220, 38, 38, 0.4)); }
        
        .card-inner { width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); position: relative; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.9); box-sizing: border-box; }
        
        .card-back { background: #0d0d0d; border: 1px solid #3f3f46; display: flex; align-items: center; justify-content: center; color: #a1a1aa; font-size: 28px; }

        }
        .result-card-static img { width: 100%; height: 100%; object-fit: cover; }
        .reversed { transform: rotate(180deg); }
        
        .result-info { font-size: 11px; line-height: 1.6; padding: 2px; box-sizing: border-box; color: #a1a1aa; text-align: left; margin-top: 8px; width: 100%; }
        .card-title-en { display: block; color: #ffffff; font-size: 12px; font-weight: 700; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-title-cn { display: block; color: #a1a1aa; font-size: 11px; margin-top: 1px; margin-bottom: 4px; }
        
        .orientation { font-weight: bold; margin: 4px 0; font-size: 10px; }

        .reversed-text { color: #ef4444; }
        
        .summary-box {

        .summary-box p { margin: 12px 0 0 0; font-size: 12px; color: #d1d1d1; text-indent: 2em; text-align: justify; }

        // 音效引擎
        const AudioEngine = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type, step = 0) {
            if (AudioEngine.state === 'suspended') { AudioEngine.resume(); }
            const now = AudioEngine.currentTime;
            
            if (type === 'click') {
                const osc = AudioEngine.createOscillator(); const gain = AudioEngine.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
                gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.connect(gain); gain.connect(AudioEngine.destination); osc.start(now); osc.stop(now + 0.05);
            } 
            else if (type === 'shuffle_tick') {
                const osc = AudioEngine.createOscillator(); const filter = AudioEngine.createBiquadFilter(); const gain = AudioEngine.createGain();
                osc.type = 'triangle'; 
                let freq = 130 + (Math.random() * 40); 
                osc.frequency.setValueAtTime(freq, now); 
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.06);
                filter.type = 'lowpass'; filter.frequency.setValueAtTime(200, now); 
                gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                osc.connect(filter); filter.connect(gain); gain.connect(AudioEngine.destination); osc.start(now); osc.stop(now + 0.06);
            } 
            else if (type === 'flip') {
                const oscBase = AudioEngine.createOscillator(); const oscTop = AudioEngine.createOscillator(); const gain = AudioEngine.createGain();
                let baseFreq = 220.00; if (step === 1) baseFreq = 261.63; if (step === 2) baseFreq = 329.63;
                oscBase.type = 'sine'; oscBase.frequency.setValueAtTime(baseFreq, now); oscBase.frequency.exponentialRampToValueAtTime(baseFreq * 0.4, now + 0.4);
                oscTop.type = 'triangle'; oscTop.frequency.setValueAtTime(baseFreq * 3, now); oscTop.frequency.exponentialRampToValueAtTime(baseFreq * 5, now + 0.3);
                gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                oscBase.connect(gain); oscTop.connect(gain); gain.connect(AudioEngine.destination); 
                oscBase.start(now); oscTop.start(now); oscBase.stop(now + 0.45); oscTop.stop(now + 0.45);
            } 
            else if (type === 'error') {
                const osc = AudioEngine.createOscillator(); const gain = AudioEngine.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(140, now); gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain); gain.connect(AudioEngine.destination); osc.start(now); osc.stop(now + 0.15);
            } 
            else if (type === 'success') {
                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((freq, index) => {
                    const osc = AudioEngine.createOscillator(); const gain = AudioEngine.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now + index * 0.05);
                    gain.gain.setValueAtTime(0.06, now + index * 0.05); gain.gain.exponentialRampToValueAtTime(0.002, now + index * 0.05 + 0.15);
                    osc.connect(gain); gain.connect(AudioEngine.destination); osc.start(now + index * 0.05); osc.stop(now + index * 0.05 + 0.15);
                });
            } 
            else if (type === 'capture') {
                const osc = AudioEngine.createOscillator(); const gain = AudioEngine.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(1800, now); gain.gain.setValueAtTime(0.06, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain); gain.connect(AudioEngine.destination); osc.start(now); osc.stop(now + 0.08);
            }
        }

            "The Moon": { nameCN: "月亮", general: { upright: "潛意識進入了充滿迷霧、焦慮與未知恐懼的幽暗海域。此時資訊極不透明，不要盲目做決策。", reversed: "恭喜你！潛意識底層的恐懼與焦慮開始逐漸消散。那些誤解與秘密即將水落石出。" }, love: { upright: "這是一段充滿不安、猜忌與情緒起伏的地下情或曖昧期。信任基礎極其脆弱。", reversed: "感情中的誤會與謊言即將被拆穿，雙方終於不再逃避問題。隱藏的不安感正逐步退場。" }, work: { upright: "職場環境充滿了爾虞我詐或派系鬥爭。現階段的專案合約細節極不透明，暗藏陷阱。", reversed: "原本混亂、拉扯不清的職場人事糾紛開始落幕。你終於看清了專案的真實走向。" } },
            "The Sun": { nameCN: "太陽", general: { upright: "象徵著極致的成功、榮耀、活力與純粹的快樂。萬事大吉的至尊王牌。", reversed: "雖然整體運勢依舊保持在水準之上，但光芒可能被短暫烏雲遮蔽。成功只會遲到，絕不缺席。" }, love: { upright: "感情運勢爆棚！彼此的互動充滿了陽光、熱情與毫無保留的坦率。極度受人羨慕。", reversed: "感情依舊溫暖，但彼此之間少了一點剛開始的激情火花。注意不要因為小脾氣消磨熱情。" }, work: { upright: "事業上迎來大光明的鼎盛時期。不論是創業、求職還是升遷，你都將獲得無與倫比的成功。", reversed: "專案雖然能夠成功，但過程會比預期中多花費一些時間。職場上注意不要功高震主。" } },
            "Judgement": { nameCN: "審判", general: { upright: "命運的號角已經吹響，迎來重大覺醒與因果了結。做出改變一生命運之重大決定。", reversed: "暗示你正處於逃避狀態。因為害怕跨出舒適圈而選擇了拖延，會讓你錯失系統升級機會。" }, love: { upright: "感情上迎來破鏡重圓、或者是關係面臨生死存亡後的重大昇華。走向命運交織的深刻轉折。", reversed: "面對感情中已經重複發生數次的致命問題，你依舊拒絕做出理智的了斷。無意義地內耗。" }, work: { upright: "職場上面臨關鍵的裁決或重大轉機，例如官司勝訴、或迎來一個能翻轉職業生涯的黃金職缺。", reversed: "工作中因為猶豫不決而錯失了跳槽或晉升的黃金期。過往的失誤缺乏承擔的勇氣。" } },
            "The World": { nameCN: "世界", general: { upright: "恭喜！本階段的旅程已達到完美的終點與大圓滿。代表著成功、圓滿結束以及內心和諧。", reversed: "暗示你距離最後的成功只剩下最後一哩路，千萬不要在此時鬆懈，咬緊牙關完成最後封裝。" }, love: { upright: "感情迎來最完美的大結局。彼此的靈魂達到了天衣無縫的融合與和諧。宇宙給予最高規格祝福。", reversed: "感情大體上非常穩定幸福，但心中總覺得缺少了臨門一腳的極致激情，存在微小阻礙。" }, work: { upright: "事業達到顛峰狀態！交出了一份無可挑剔的完美成績單。享受無上榮耀與實質財富的收穫期。", reversed: "工作專案已經完成了 99%，卻在最後的驗收階段卡在一些繁瑣的行政流程上。保持耐性。" } },

        };

        let currentHandData = []; let currentFlipIndex = 0; let selectedType = 'general';
        let animationFrameId = null;

        function switchView(viewId) { document.querySelectorAll('.view-node').forEach(node => node.classList.remove('active-node')); document.getElementById(viewId).classList.add('active-node'); }
        function resetDivinationEngine() { document.getElementById('question').value = ''; document.getElementById('user-question-display').innerText = ''; document.getElementById('flow-hint').innerText = ''; document.getElementById('deck').innerHTML = ''; if (animationFrameId) cancelAnimationFrame(animationFrameId); }
        function resetToHome() { resetDivinationEngine(); switchView('home-view'); }

        function startTarotSession() {
            const questionInput = document.getElementById('question').value.trim();
            selectedType = document.getElementById('question-type').value;
            if (questionInput === "") { playSound('error'); alert("🔮 占卜需要誠心，請先輸入你想問的問題喔！"); return; }
            playSound('click');
            const typeNames = { 'general': '綜合運勢', 'love': '感情發展', 'work': '工作學業' };
            document.getElementById('user-question-display').innerText = `[ MATRIX_TARGET // ${typeNames[selectedType]} : ${questionInput} ]`;
            document.getElementById('flow-hint').innerText = "SHUFFLING_DECK...";
            
            initStaticDeck();
            currentFlipIndex = 0;
            
            const shuffled = [...tarotData.cards].sort(() => 0.5 - Math.random());
            currentHandData = shuffled.slice(0, 3).map(card => { return { ...card, isReversed: Math.random() < 0.5 }; });
            
            runChaosSweepShuffle(); 
        }

        function initStaticDeck() {
            const deckDiv = document.getElementById('deck'); deckDiv.innerHTML = '';
            const positions = ["過去 // PAST", "現在 // PRESENT", "未來 // FUTURE"];
            for (let i = 0; i < 3; i++) {
                const cardBox = document.createElement('div'); cardBox.className = 'card-box';
                cardBox.innerHTML = `<h3>${positions[i]}</h3><div class="card" id="card-${i}" onclick="handleCardFlip(${i})"><div class="card-inner"><div class="card-back">⚝</div><div class="card-front" id="front-slot-${i}"></div></div></div>`;
                deckDiv.appendChild(cardBox);
            }
        }

        // ==================== 【重構：反直升機螺旋槳 // 絲滑交錯混亂亂流引擎】 ====================
        function runChaosSweepShuffle() {
            const cards = [
                document.getElementById('card-0'),
                document.getElementById('card-1'),
                document.getElementById('card-2')
            ];

            // 開啟物理渲染，並暫時移除 CSS Transition 避免卡頓與拉扯
            cards.forEach(card => card.classList.add('shuffling-physics'));

            const startTime = performance.now();
            const duration = 2500; // 總洗牌時間
            let lastTickTime = 0;

            function updateSweepPhysics(now) {
                const elapsed = now - startTime;

                if (elapsed < duration) {
                    // 隨機摩擦聲控制
                    if (now - lastTickTime > 110 + Math.random() * 70) {
                        playSound('shuffle_tick');
                        lastTickTime = now;
                    }

                    // 核心橫向波段交錯算法
                    cards.forEach((card, index) => {
                        const timeFactor = now * 0.005;
                        
                        // 1. 大範圍橫向左右穿梭（X 軸擺幅 140px，每張牌的相位完全錯開）
                        let translateX = 140 * Math.sin(timeFactor + (index * 2.1));
                        
                        // 2. 輕微的上下浮動（Y 軸最大僅 15px，維持水平線搓牌感）
                        let translateY = 15 * Math.cos(timeFactor * 1.5 + (index * 1.2));
                        
                        // 3. 微幅隨機偏角（最大正負 8 度，告別醜陋的直升機旋轉！）
                        let rotateDeg = 8 * Math.sin(timeFactor * 0.7 + (index * 3.5));

                        // 4. 高頻率圖層穿梭：利用正弦波決定 z-index 順序
                        let layerZIndex = 10 + Math.floor(5 * Math.sin(timeFactor * 3.2 + index * 2.0));
                        card.style.zIndex = layerZIndex;

                        // 實時矩陣變換
                        card.style.transform = `translate(${translateX}px, ${translateY}px) rotate(${rotateDeg}deg)`;
                    });

                    animationFrameId = requestAnimationFrame(updateSweepPhysics);
                } else {
                    // 洗牌流暢收尾：解除物理狀態，平滑收回中央牌堆
                    cards.forEach((card, i) => {
                        card.classList.remove('shuffling-physics');
                        card.style.zIndex = 10 + i;
                        card.style.transform = `translate(0px, 0px) rotate(0deg)`; // 歸零收牌

                        const slot = document.getElementById('front-slot-' + i);
                        if (slot) slot.innerHTML = `<img src="cards/${currentHandData[i].img}" class="${currentHandData[i].isReversed ? 'reversed' : ''}" alt="${currentHandData[i].name}">`;
                    });

                    // 預留 500ms 給卡牌收攏的過渡，接著觸發自然發牌
                    setTimeout(() => {
                        unlockNextCard();
                    }, 500);
                }
            }

            animationFrameId = requestAnimationFrame(updateSweepPhysics);
        }

        function unlockNextCard() {
            if (currentFlipIndex < 3) {
                const targetCard = document.getElementById(`card-${currentFlipIndex}`);
                if (targetCard) {
                    targetCard.style.transform = ""; // 清空行內樣式，還給 CSS Grid 進行高精度發牌定位
                    targetCard.classList.add('playable');
                }
                const posName = currentFlipIndex === 0 ? "過去" : (currentFlipIndex === 1 ? "現在" : "未來");
                document.getElementById('flow-hint').innerText = `👉 請點擊翻開【${posName}】數據節點`;
            } else {
                document.getElementById('flow-hint').innerText = "SYSTEM_SUCCESS // 占卜完成...";
                playSound('success'); setTimeout(() => { compileAndShowResultView(); }, 1000);
            }
        }

        function handleCardFlip(index) {
            const cardEl = document.getElementById(`card-${index}`);
            if (cardEl && cardEl.classList.contains('playable') && !cardEl.classList.contains('flipped')) {
                playSound('flip', index); cardEl.classList.add('flipped'); cardEl.classList.remove('playable');
                currentFlipIndex++; setTimeout(() => { unlockNextCard(); }, 600);
            }
        }

        function compileAndShowResultView() {
            const questionInput = document.getElementById('question').value.trim();
            const typeNames = { 'general': '綜合運勢', 'love': '感情發展', 'work': '工作學業' };
            document.getElementById('result-question-title').innerText = `[ 矩陣解構目標 // ${typeNames[selectedType]} : ${questionInput} ]`;
            const resultDeckDiv = document.getElementById('result-deck-display'); resultDeckDiv.innerHTML = '';
            const positions = ["過去 // PAST", "現在 // PRESENT", "未來 // FUTURE"];
            
            currentHandData.forEach((card, index) => {
                const cardMeaning = tarotMeanings[card.name] || tarotMeanings["default"];
                const typeMeaning = cardMeaning[selectedType] || cardMeaning["general"];
                const explanation = card.isReversed ? typeMeaning.reversed : typeMeaning.upright;
                const oriText = card.isReversed ? "逆位 // REVERSED" : "正位 // UPRIGHT";
                
                const cardBox = document.createElement('div'); cardBox.className = 'card-box';
                cardBox.innerHTML = `<h3>${positions[index]}</h3><div class="result-card-static"><img src="cards/${card.img}" class="${card.isReversed ? 'reversed' : ''}"></div><div class="result-info"><span class="card-title-en">${card.name}</span><span class="card-title-cn">${cardMeaning.nameCN}</span><div class="orientation ${card.isReversed ? 'reversed-text' : 'upright-text'}">${oriText}</div><p style="margin:5px 0; font-size:11px; text-align:justify; letter-spacing:0.02em;">${explanation}</p></div>`;
                resultDeckDiv.appendChild(cardBox);
            });
            generateComprehensiveSummary(); switchView('result-view');
        }

        function generateComprehensiveSummary() {
            const pCard = currentHandData[0]; const prCard = currentHandData[1]; const fCard = currentHandData[2];
            const pName = (tarotMeanings[pCard.name] || tarotMeanings["default"]).nameCN + (pCard.isReversed ? "逆位" : "正位");
            const prName = (tarotMeanings[prCard.name] || tarotMeanings["default"]).nameCN + (prCard.isReversed ? "逆位" : "正位");
            const fName = (tarotMeanings[fCard.name] || tarotMeanings["default"]).nameCN + (fCard.isReversed ? "逆位" : "正位");
            const totalUprights = currentHandData.filter(c => !c.isReversed).length; 
            
            let introText = "", coreAnalysis = "", adviceText = "";
            
            if (totalUprights === 3) { 
                introText = `本次矩陣解構呈現線性流動。從過去的【${pName}】到現在的【${prName}】，你的潛意識能量一直處於順暢循環的完美狀態。`; 
                coreAnalysis = `這代表你當前詢問的事情，發展脈絡極其清晰，外界的雜訊與干擾非常微弱。隨著未來的【${fName}】數據落座，這股正向動能將會順理成章地推向大圓滿。`; 
                adviceText = "請完全信任你的內在直覺，配合你現有的資源與強大行動力，大膽地向前推進，果斷做出跨越性的核心決策！"; 
            }
            else if (totalUprights === 2) { 
                introText = `矩陣分析顯示，整體局勢正朝著積極的方向靠攏。雖然在時間軸的某個特定節點上伴隨著些微的遲滯、制約或能量微調，但主流能量依舊由正位牌組強勢主導。`; 
                coreAnalysis = `過去、現在、未來三節點中，【${pName}】與【${prName}】相互交織，顯示出雖然有一些盲點、殘留課題或環境阻力需要時間消化，但並不足以阻擋未來的【${fName}】所帶來的全新破局氣象。`; 
                adviceText = "建議你維持現有的基礎步調，並對目前的執行計劃進行局部的精密微調。只需要保持足夠的耐心，當前的微小阻礙自然會在流動中迎刃而解。"; 
            }
            else if (totalUprights === 1) { 
                introText = `當前牌陣中出現了較多的逆位能量拉扯，這是一份來自潛意識矩陣深處的嚴肅警訊。目前的局勢中隱藏著較多的制約、焦慮、資訊不對稱或是能量嚴重受阻的情況。`; 
                coreAnalysis = `雖然有部分節點試圖提供底層支撐，但從整體時間軸的張力來看，逆位的壓抑力量明顯壓過了前進的動能，這意味著內部盲點或外界環境帶來的拉扯正處於爆發高峰期。`; 
                adviceText = "目前時機尚未成熟，不宜盲目推展與強求任何實質結果。建議先將焦點從外在的追求轉回內心，停下腳步沉澱情緒，徹底找出當前的核心系統盲點進行整頓。"; 
            }
            else { 
                introText = `三數據節點全數呈現逆位（【${pName}】 ➔ 【${prName}】 ➔ 【${fName}】）。這意味著當前的潛意識矩陣正經歷著一場徹底的底層架構重組、代碼崩潰與能量低潮期。`; 
                coreAnalysis = `這並非全無益處，而是局勢在強烈暗示：你過去習慣的應對模式、思考方向或執念已經完全行不通了。內在的壓抑、混難與外界的巨大阻力此時正交織在一起。`; 
                adviceText = "這是最需要徹底放手與臣服的時刻。請立刻停止所有高風險的試探、強求或勉強的擴張行動。給自己充足的時間進行內心的全面大掃除，靜靜等待矩陣能量重新完成自我修復。"; 
            }
            
            const summaryDiv = document.getElementById('summary-section');
            summaryDiv.innerHTML = `<h2>🔮 [ 綜合點評 ]</h2><p>${introText}</p><p>${coreAnalysis}</p><p>${adviceText}</p>`;
        }

        function generateCardAndRedirect() {
            playSound('capture'); const targetNode = document.getElementById('capture-node');
            html2canvas(targetNode, { backgroundColor: "#050505", scale: 2, useCORS: true }).then(canvas => {
                const image = canvas.toDataURL("image/png"); const link = document.createElement('a'); link.download = 'Tarot-Report.png'; link.href = image; link.click();
                setTimeout(() => { window.location.href = "https://s.shopee.tw/40eMd6bUyk"; }, 1000);
            }).catch(err => { window.location.href = "https://s.shopee.tw/40eMd6bUyk"; });
        }
    </script>
